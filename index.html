<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B2415">
<meta name="description" content="Yamb Café: Yamb (Jamb), the classic dice game. Daily dice, fair duels, house rules, characters, a coach and a real-dice score sheet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yamb Café">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yamb Café</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/v7/favicon-64.png">
<link rel="apple-touch-icon" href="icons/v7/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+SC:wght@700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400;1,500;1,700&family=Alfa+Slab+One&family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a walnut café table fills the screen. The home screen is a printed café menu on paper; the game is
   a chalkboard in a wooden frame with a felt dice tray. Type: Alegreya (titles), Alegreya Sans (everything else),
   Alegreya SC (menu section heads), Caveat (handwriting and chalk). All have Cyrillic letters.
   Only the wordmark uses Alfa Slab One, which is Latin only. */
:root{
  --wood:#4A2F1C; --wood-hi:#5E3C24; --wood-lo:#3B2415;
  --cloth:#C8322B; --cloth-lo:#8E1F1A; --cloth-2:#F6F1E7;
  --slip:#F7F1E1; --coaster:#E9DCC2; --receipt:#FBF8F1;
  --paper:#FCFDFA; --grid:rgba(60,115,185,.14); --margin:#E27474;
  --text:#2A1D12; --muted:#6B5A45; --line:rgba(42,29,18,.18); --line-strong:rgba(42,29,18,.5);
  --cream:#F6EEDC; --cream-dim:#E8D9BC; --cream-line:rgba(246,238,220,.42);
  --ink:#1F3FA6; --ink-lite:#9FB4FF; --red:#C8322B; --red-lite:#FF9A8E; --coffee:#D9A066;
  --hl:rgba(255,220,50,.62); --hl-strong:rgba(255,206,0,.9); --gold:#FFD27A;
  --die:#FFFCF2; --die-edge:#D9CBAE; --pip:#1B140E; --pip-one:#C8322B;
  --ok:#5BC489; --warn:#FFC27A; --scrim:rgba(10,6,3,.62); --shadow:rgba(0,0,0,.55);
  --f-sign:'Alfa Slab One',Georgia,serif;
  --f-ui:'Alegreya Sans','Segoe UI',Roboto,sans-serif;
  --f-serif:'Alegreya',Georgia,'Times New Roman',serif;
  --f-sc:'Alegreya SC','Alegreya',Georgia,serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --f-receipt:'Courier Prime','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;font-family:var(--f-ui);font-size:16px;color:var(--cream);-webkit-tap-highlight-color:transparent;
  background-color:var(--wood);
  background-image:linear-gradient(180deg,rgba(40,22,10,.22),rgba(30,16,7,.5)),url(art/wood-768.webp);
  background-size:100% 100%,512px 512px;background-attachment:fixed,scroll}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wood-lo)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 12px}
.mark{display:flex;flex-direction:column;gap:2px;min-width:0}
/* the wordmark: cream and coffee letters with a crisp near-black outline (drawn behind the letters, so they keep their weight) and a hard drop shadow */
.word{font:400 clamp(30px,8.6vw,42px)/1 var(--f-sign);white-space:nowrap;color:var(--cream);letter-spacing:.03em;-webkit-text-stroke:.11em #140B05;paint-order:stroke fill;text-shadow:0 .08em 0 #140B05}
.tag{font:400 18px/1.1 var(--f-hand);color:var(--cream-dim)}
.word .amp{color:var(--coffee)}
.icons{display:flex;gap:8px}
.ibtn{min-width:44px;height:44px;border-radius:22px;border:1.5px solid var(--cream-line);background:transparent;color:var(--cream);display:inline-grid;place-items:center;padding:0 10px;font:700 14px var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.ibtn svg{width:20px;height:20px}
.cloth{height:16px;background-image:repeating-conic-gradient(var(--cloth) 0 25%,var(--cloth-2) 0 50%);background-size:16px 16px;box-shadow:0 3px 6px rgba(0,0,0,.3)}

/* home */
#home{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.homeIn{display:flex;flex-direction:column;gap:16px;padding-top:20px}
/* home: the café scene at the top, with the title over a soft shade */
.hero{position:relative;overflow:hidden}
.hero picture,.hero img{display:block;width:100%}
.hero img{height:clamp(220px,56vw,340px);object-fit:cover;object-position:50% 62%;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(30,17,8,.78) 0%,rgba(30,17,8,.35) 32%,rgba(30,17,8,0) 52%)}
.hero .wrap{position:absolute;inset:0 0 auto;z-index:2}
.hero .word{text-shadow:0 .08em 0 #140B05,0 4px 14px rgba(0,0,0,.35)}
.hero .tag{color:var(--cream);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero .ibtn{background:rgba(30,17,8,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.hero+.wrap .homeIn{position:relative;z-index:3;margin-top:-44px;padding-top:0}
.bigmode{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 14px;border:0;border-radius:4px;background:var(--slip);color:var(--text);text-align:left;box-shadow:0 10px 18px -8px var(--shadow),0 1px 0 rgba(0,0,0,.15)}
.bigmode .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bigmode .mt{font:700 18px var(--f-ui);letter-spacing:.01em}
.bigmode .md{font:400 17px/1.2 var(--f-hand);color:var(--muted)}
.bigmode svg{flex:none;width:16px;height:16px;color:var(--red)}
.bigmode .faces{display:flex;padding-left:10px;margin-top:6px}
.bigmode .faces .cmini{width:42px;height:42px;font-size:12px;margin-left:-9px;box-shadow:inset 0 0 0 2px var(--coaster),inset 0 0 0 4px var(--ring),0 2px 5px -1px rgba(0,0,0,.35)}
.panel .modes{margin-top:4px}
.panel .mode{background:#FFFDF6;box-shadow:inset 0 0 0 1.5px var(--line)}
.resimg{display:block;width:calc(100% + 36px);margin:-6px -18px 12px;height:auto;aspect-ratio:800/597;max-height:140px;object-fit:cover;object-position:50% 40%}
.slip{background:var(--slip);color:var(--text);border-radius:3px;box-shadow:0 10px 18px -8px var(--shadow),0 1px 0 rgba(0,0,0,.15)}
.daily{padding:16px 16px 14px;transform:rotate(-1deg);display:flex;flex-direction:column;gap:10px}
.kick{font:700 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.kick.red{color:var(--red)}
.daily .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daily .date{font:600 13px var(--f-ui);letter-spacing:.06em;color:var(--muted)}
.hand{font-family:var(--f-hand)}
.daily h2{margin:0;font:700 27px/1.1 var(--f-hand);color:var(--ink)}
.daily p{margin:0;font:400 17px/1.3 var(--f-hand);color:var(--muted)}
.minidice{display:flex;gap:7px}
.mdie{width:32px;height:32px;display:block;border-radius:16%;box-shadow:0 2px 3px rgba(0,0,0,.25)}
.mdie i{width:4.5px;height:4.5px;border-radius:50%;background:var(--pip);visibility:hidden}
.mdie i.on{visibility:visible}.mdie i.one{background:var(--pip-one);width:6.5px;height:6.5px}
.btnRed{min-height:48px;border:0;border-radius:10px;background:var(--cloth);color:#FFF7EA;font:700 17px var(--f-ui);letter-spacing:.01em;box-shadow:0 3px 0 var(--cloth-lo);padding:0 16px}
.btnRed:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cloth-lo)}
.btnInk{min-height:44px;border:1.5px solid var(--line-strong);border-radius:10px;background:transparent;color:var(--text);font:700 15px var(--f-ui);letter-spacing:.01em;padding:0 14px}
.btnRow{display:flex;gap:8px;flex-wrap:wrap}
.btnRow>*{flex:1}
.lbl{font:700 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim)}
.tagcard{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;background:rgba(246,238,220,.1);border:1.5px dashed var(--cream-line);color:var(--cream)}
.tagcard .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tagcard .tl{font:700 13px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim)}
.tagcard .tm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagcard .ts{font:800 20px var(--f-serif);font-variant-numeric:lining-nums;white-space:nowrap}
.tagcard .tb{display:flex;gap:6px}
.sbtn{min-height:40px;border:0;border-radius:9px;padding:0 14px;background:var(--cream);color:var(--text);font:700 14px var(--f-ui);letter-spacing:.01em}
.sbtn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--cream-line)}
.sbtn.red{background:var(--cloth);color:#FFF7EA}
.coasters{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.coasters::-webkit-scrollbar{display:none}
.coaster{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:0;background:transparent;color:var(--cream);scroll-snap-align:start}
.cdisc{width:84px;height:84px;border-radius:50%;background:var(--coaster);display:grid;place-items:center;font:800 25px var(--f-serif);box-shadow:0 6px 10px -4px var(--shadow),inset 0 0 0 5px var(--coaster),inset 0 0 0 7px var(--ring,#2A1D12);color:var(--ring,#2A1D12)}
.cname{font:700 15px var(--f-ui);letter-spacing:.02em;text-align:center;line-height:1.1}
.chabit{font:500 18px/1.05 var(--f-hand);color:var(--cream-dim);text-align:center}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(246,238,220,.25)}
.dots i.on{background:var(--gold)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border:0;border-radius:4px;background:var(--slip);color:var(--text);text-align:left;box-shadow:0 4px 8px -4px var(--shadow)}
.mode .mt{display:block;font:700 17px var(--f-ui);letter-spacing:.01em}
.mode .md{display:block;font-size:14px;color:var(--muted)}
.mode svg{flex:none;width:16px;height:16px;color:var(--red)}
.mode span:first-child{flex:1}
.footrow{display:flex;gap:8px;flex-wrap:wrap}
.nudge{margin-top:14px;padding:14px 16px;border-radius:12px;background:rgba(246,238,220,.08);border:1.5px solid var(--cream-line);color:var(--cream)}
.nudge b{display:block;font:700 16px var(--f-ui)}
.nudge>span{display:block;margin-top:3px;font:400 15px/1.35 var(--f-ui);color:var(--cream-dim)}
.nudge .row2{display:flex;gap:8px;margin-top:10px}.nudge .row2 .sbtn{flex:1}
.footrow .sbtn{flex:1;padding:0 8px;font-size:13px;letter-spacing:.03em}
/* home: one printed menu card. Daily section, then "At the table" with raised buttons, then two pills. */
.menu{position:relative;border-radius:6px;padding:7px;color:var(--text);background-color:var(--slip);
  background-image:radial-gradient(rgba(120,86,48,.07) 1px,transparent 1.3px),radial-gradient(rgba(120,86,48,.05) 1px,transparent 1.3px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  box-shadow:0 18px 30px -12px rgba(0,0,0,.7),0 2px 0 rgba(0,0,0,.25)}
.menuIn{border:1px solid rgba(42,29,18,.28);border-radius:3px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sec{display:flex;align-items:center;gap:10px;margin:0;font:700 14px/1.2 var(--f-sc);letter-spacing:.16em;color:#A8261F;text-align:center}
.sec::before,.sec::after{content:"";flex:1;min-width:16px;height:1px;background:rgba(42,29,18,.3)}
.sec.next{margin-top:2px}
.drow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.drow h2{margin:0;font:800 27px/1.1 var(--f-serif);color:var(--text)}
.drow .date{font:italic 500 15px var(--f-ui);color:var(--muted);white-space:nowrap}
.menu .minidice{gap:8px;padding:0 2px}
.menu .mdie{width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));box-shadow:none}
.menu .btnRed{min-height:52px;border-radius:12px;font:800 20px var(--f-ui);box-shadow:0 4px 0 var(--cloth-lo),inset 0 1px 0 rgba(255,255,255,.18)}
.menu .btnRed:active{box-shadow:0 1px 0 var(--cloth-lo)}
.menu .note{margin:0;text-align:center;font:500 21px/1.2 var(--f-hand);color:var(--muted)}
.menu .note.left{text-align:left;padding:0 2px}
.token{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 14px;border:1px solid rgba(42,29,18,.16);border-radius:12px;background:#FFFCF5;color:var(--text);text-align:left;
  box-shadow:0 3px 0 #DDCDA9,0 8px 12px -8px rgba(42,29,18,.45)}
.token:active{transform:translateY(2px);box-shadow:0 1px 0 #DDCDA9}
.token .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.token .mt{font:700 21px/1.15 var(--f-serif)}
.token .md{font:italic 400 16px/1.25 var(--f-ui);color:var(--muted)}
.token .faces{display:flex;padding-left:8px;margin-top:5px}
.token .faces .cmini{--fi:4px;width:34px;height:34px;margin-left:-8px;box-shadow:inset 0 0 0 2px #FFFCF5,inset 0 0 0 4px var(--ring),0 2px 4px -1px rgba(0,0,0,.3)}
.badge{flex:none;width:36px;height:36px;border-radius:18px;background:var(--cloth);color:#FFF7EA;display:grid;place-items:center;box-shadow:0 3px 0 var(--cloth-lo)}
.badge.blue{background:#2F4F9A;box-shadow:0 3px 0 #1E3570}
.badge svg{width:15px;height:15px}
.pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.pillbtn{min-height:44px;border-radius:22px;border:1.5px solid rgba(42,29,18,.32);background:transparent;color:var(--text);font:700 16px/1.1 var(--f-ui);display:flex;align-items:center;justify-content:center;gap:7px;padding:4px 10px;min-width:0}
.pillbtn svg{flex:none;width:17px;height:17px;color:#A8261F}

/* game */
#game{min-height:100%}
.gtop{display:flex;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 6px}
.gtop .ibtn{border:0;background:var(--cream);color:var(--text);box-shadow:0 3px 0 #C9B48F,0 6px 10px rgba(0,0,0,.35)}
.chips{padding-inline:3px}
.chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 1 auto;min-width:0;max-width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 14px;border-radius:24px;border:1.5px solid rgba(246,238,220,.3);background:rgba(246,238,220,.14);color:var(--cream);margin:3px 0 6px}
.chip .cn{display:block;font:800 15px/1.1 var(--f-serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px;text-align:left}
.chip .cs{font:800 25px/1 var(--f-serif);font-variant-numeric:lining-nums tabular-nums;color:var(--pc)}
.chip .cw{display:block;font:italic 700 13px/1.1 var(--f-ui);color:var(--gold);text-align:left}
.chip.view{background:var(--cream);color:var(--text);border-color:var(--cream);box-shadow:0 4px 0 #C9B48F}
.chip.cur{box-shadow:0 0 0 3px var(--red)}.chip.view.cur{box-shadow:0 4px 0 #C9B48F,0 0 0 3px var(--red)}
.chip.view .cs{color:var(--ink)}
.chip.view .cw{color:#B42A23}
.chip.win .cs{text-decoration:underline wavy var(--gold) 2px;text-underline-offset:4px}
.chip>span:first-child{min-width:0;overflow:hidden}
.chip .cw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:389px){.chip{flex:1 1 0;padding:4px 9px}.chip .cn{font-size:13px}.chip .cw{font-size:12px}}
@media (max-width:359px){.chip{flex-direction:column;justify-content:center;gap:1px;padding:4px 4px 5px;border-radius:16px}.chip>span:first-child{max-width:100%}.chip .cn{font-size:12.5px;max-width:100%;text-align:center}.chip .cw{display:none}.chip .cs{font-size:21px}th .cnm{font-size:calc(9.5px*max(var(--z),.9));letter-spacing:0}}
.chips.many{gap:4px}
.chips.many .chip{flex:1 1 0;min-width:46px;flex-direction:column;justify-content:center;gap:1px;padding:4px 3px 5px;border-radius:16px}
.chips.many .chip>span:first-child{max-width:100%}
.chips.many .chip .cn{font-size:12.5px;letter-spacing:0;text-transform:none;max-width:100%;text-align:center}
.chips.many .chip .cw{display:none}
.chips.many .chip .cs{font-size:21px}
.chips.n3 .chip .cn{font-size:13px}
.chips.many .chip.cur{box-shadow:0 0 0 2.5px var(--red)}
.chips.many .chip.view.cur{box-shadow:0 3px 0 #C9B48F,0 0 0 2.5px var(--red)}
.bubbleRow{display:flex;align-items:flex-end;gap:8px;min-height:0;margin-bottom:8px}
.bubble{max-width:260px;padding:6px 14px;border-radius:16px 16px 16px 4px;background:#FBF8F1;color:var(--text);font:600 21px/1.15 var(--f-hand);box-shadow:0 4px 0 #D9CBAE;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.cmini{width:40px;height:40px;flex:none;border-radius:50%;background:var(--coaster);display:grid;place-items:center;font:800 14px var(--f-serif);color:var(--ring);box-shadow:inset 0 0 0 3px var(--coaster),inset 0 0 0 5px var(--ring),0 4px 8px -3px var(--shadow)}

/* score sheet: a café chalkboard in a wooden frame. --z scales every row and font (Fit, Large, Huge). */
.sheetWrap{padding-top:10px;padding-bottom:calc(var(--tray-h,260px) + 20px)}
.paper{--z:1;--slate:#1E2924;--chalk:#ECEEE6;--chalk-dim:rgba(236,238,230,.6);--chalk-line:rgba(236,238,230,.15);--chalk-strong:rgba(236,238,230,.42);--chalk-y:#FFE27A;
  position:relative;color:var(--chalk);border-radius:5px;background-color:var(--slate);
  background-image:radial-gradient(120% 70% at 25% 12%,rgba(255,255,255,.07),transparent 60%),radial-gradient(90% 60% at 85% 95%,rgba(255,255,255,.05),transparent 60%),repeating-linear-gradient(112deg,rgba(255,255,255,.016) 0 2px,transparent 2px 7px);
  border-radius:11px;box-shadow:0 0 0 8px #8A5A33,0 0 0 9px rgba(62,39,21,.9),inset 0 0 34px rgba(0,0,0,.6),0 22px 30px -12px rgba(0,0,0,.75)}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{height:calc(31px*var(--z));padding:0;text-align:center;vertical-align:middle;border-bottom:1px solid var(--chalk-line)}
td{border-left:1px solid rgba(236,238,230,.07)}
th.lab+td{border-left:0}
thead th{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--slate);height:calc(40px*var(--z));vertical-align:bottom;padding-bottom:calc(4px*var(--z));border-bottom:1.5px solid var(--chalk-strong)}
thead th:first-child{border-top-left-radius:11px}thead th:last-child{border-top-right-radius:11px}
/* column arrows: the phone's own font draws ↓ ↑ ↕ at one size; Alegreya Sans draws them unevenly */
.sym{display:block;font:700 calc(19px*var(--z))/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--chalk)}
.cnm{display:block;margin-top:2px;font:700 calc(11px*max(var(--z),.9))/1.2 var(--f-sc);letter-spacing:.05em;color:var(--chalk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:1px}

thead th.lab{width:calc(var(--labw,22%)*min(max(var(--z),1),1.35));vertical-align:middle;padding:0 0 0 4px}
@media (max-width:419px){.cnm{letter-spacing:0}thead th.lab{width:calc((var(--labw,22%) + 5%)*min(max(var(--z),1),1.35))}}
.mini{display:inline-block;width:calc(21px*var(--z));height:calc(21px*var(--z));vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));-webkit-user-drag:none}
tr.sum>*{background:rgba(0,0,0,.2);border-top:1px solid var(--chalk-strong);height:calc(27px*var(--z));font:800 calc(15.5px*var(--z)) var(--f-serif);font-variant-numeric:lining-nums tabular-nums}
tr.tot>*{border-top:3px double var(--chalk-strong);border-bottom:0;height:calc(38px*var(--z));font:800 calc(18px*var(--z)) var(--f-serif);font-variant-numeric:lining-nums tabular-nums;color:var(--chalk-y)}
.midl{font-size:calc(11px*var(--z))}
sup{font:700 calc(10px*var(--z)) var(--f-ui);color:var(--pc);margin-left:1px;vertical-align:5px}
.w{display:inline-block;font:700 calc(25px*var(--z))/1 var(--f-hand);color:var(--pc);transform:rotate(var(--rot,0deg));text-shadow:0 0 1px currentColor,0 0 6px rgba(255,255,255,.08)}

.w.just{animation:ink .55s ease-out both}
@keyframes ink{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cell{appearance:none;border:0;margin:0;padding:0;background:transparent;width:100%;height:100%;min-height:0;display:grid;place-items:center;position:relative;isolation:isolate;font:800 calc(15.5px*var(--z)) var(--f-ui);font-variant-numeric:lining-nums tabular-nums;color:#F2D46B}
.cell::before{content:"";position:absolute;inset:calc(5px*var(--z)) max(4px,calc(50% - 22px));border-radius:999px;z-index:-1;background:rgba(242,212,107,.22)}
.cell.zero{color:rgba(242,212,107,.55)}.cell.zero::before{background:rgba(242,212,107,.09)}
.cell.call::before{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(242,212,107,.6)}

.cell.sel::after{content:"";position:absolute;inset:2px;border:2px solid var(--pc);border-radius:8px}

/* sheet size switch, in the empty top-left corner of the board */
.zbtn{display:inline-flex;align-items:center;gap:2px;max-width:calc(100% - 4px);box-sizing:border-box;min-height:30px;padding:0 6px 0 4px;border-radius:15px;border:1.5px solid var(--chalk-strong);background:rgba(255,255,255,.04);color:var(--chalk);font:700 13px var(--f-ui);white-space:nowrap;overflow:hidden}

/* tray */

  background-color:var(--wood-lo);background-image:linear-gradient(180deg,rgba(45,26,12,.62),rgba(20,11,5,.82)),url(art/wood-768.webp);background-size:100% 100%,512px 512px;
  border-top:3px solid rgba(0,0,0,.35);box-shadow:0 -12px 28px -10px var(--shadow);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}

.status{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;font:600 15px var(--f-ui);letter-spacing:.01em;color:var(--cream-dim)}
.st{display:flex;gap:6px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}

.lnk.minus{min-width:40px;min-height:40px;padding:0;border-radius:20px;border:1.5px solid rgba(246,238,220,.45);text-decoration:none;font-size:20px;line-height:1}
.dice{display:flex;justify-content:center;gap:clamp(8px,3vw,14px);padding:20px 6px 12px;min-height:66px;align-items:flex-end;border-radius:20px;border:6px solid #8A5A33;
  background-color:#2C5944;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px),radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.4px);background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;
  box-shadow:inset 0 6px 14px rgba(0,0,0,.55),0 5px 0 #5E3C24,0 10px 14px -6px rgba(0,0,0,.6)}
.dice.six{gap:clamp(6px,2vw,10px)}
.die{--d:clamp(44px,13.5vw,58px);width:var(--d);height:var(--d);flex:none;box-sizing:border-box;padding:calc(var(--d)*.14);border:0;border-radius:23%;background:var(--die);
  box-shadow:0 4px 4px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;transition:transform .16s ease,box-shadow .16s ease;transform:rotate(var(--r,0deg))}
/* the painted dice (art/dice): one look for every die in the game */
.die:not(.unset),.mdie{padding:0;background:transparent;border-radius:16%}
.die img.dface,.mdie img.dface{grid-area:1/1/4/4;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.six .die{--d:clamp(36px,11.5vw,52px)}
.die i{display:block;width:calc(var(--d)*.16);height:calc(var(--d)*.16);border-radius:50%;background:var(--pip);visibility:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.45)}
.die i.on{visibility:visible}
.die i.one{background:var(--pip-one);width:calc(var(--d)*.23);height:calc(var(--d)*.23)}
/* each die sits in a slot; a kept die pops up off the table, straightens and glows in the player's colour, leaving its shadow below */
.dslot{position:relative;display:inline-grid;place-items:center;flex:none}
.dslot::after{content:"";position:absolute;left:14%;right:14%;bottom:-4px;height:9px;border-radius:50%;background:rgba(0,0,0,.42);filter:blur(3px);opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.dslot.kept::after{opacity:1;transform:scale(1)}
.dslot .die{position:relative;z-index:1}
.die.held{transform:translateY(-16px) scale(1.08);
  box-shadow:0 0 0 3px var(--pcl,var(--cream)),0 0 18px 3px rgba(255,255,255,.35),0 20px 14px -8px rgba(0,0,0,.6);
  box-shadow:0 0 0 3px var(--pcl,var(--cream)),0 0 18px 3px color-mix(in srgb,var(--pcl,#fff) 65%,transparent),0 20px 14px -8px rgba(0,0,0,.6)}
.die.held.popin{animation:popkeep .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes popkeep{0%{scale:.9}55%{scale:1.1}100%{scale:1}}
.die.ghost{outline:2.5px dashed var(--gold);outline-offset:4px}
.die.idle{opacity:.28;box-shadow:none}
.die.unset{background:rgba(246,238,220,.12);box-shadow:inset 0 0 0 2px var(--cream-line);color:var(--cream);font:700 22px var(--f-ui);display:grid;place-items:center;grid-template:none;padding:0}

@keyframes tumble{0%{translate:0 0;rotate:0deg}20%{translate:0 -16px;rotate:-25deg}50%{translate:0 4px;rotate:15deg}75%{translate:0 -3px;rotate:-5deg}100%{translate:0 0;rotate:0deg}}
.hint{margin:0;text-align:center;min-height:20px;font:500 16px/1.3 var(--f-ui);color:var(--cream-dim);text-wrap:balance}

.acts{display:flex;gap:8px;align-items:stretch}
.glass{flex:1;min-height:60px;border-radius:31px;border:0;color:#FFF7EA;background:var(--cloth);box-shadow:0 6px 0 var(--cloth-lo),inset 0 2px 0 rgba(255,255,255,.2);margin-bottom:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:none;user-select:none;-webkit-user-select:none}

.hintbtn{flex:none;width:60px;min-height:60px;border-radius:30px;border:0;background:var(--cream);color:var(--text);box-shadow:0 6px 0 #C9B48F;margin-bottom:6px;display:grid;place-items:center}

.picker{display:flex;gap:6px;justify-content:center}

.panel{position:relative;box-sizing:border-box;width:min(560px,100%);max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--slip);color:var(--text);
  border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px -10px var(--shadow);animation:rise .36s cubic-bezier(.2,.95,.3,1.06)}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){.modal{align-items:center}.panel{border-radius:16px;max-height:calc(100% - 48px)}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel h2{margin:0;font:800 26px/1.1 var(--f-serif);color:var(--text)}

.x{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;color:var(--text);font:500 24px/1 var(--f-ui)}
.field{display:grid;gap:6px;margin-top:12px}

.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;padding:4px;border-radius:11px;background:rgba(42,29,18,.08)}
.seg button{min-height:42px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:700 15px var(--f-ui);letter-spacing:.01em;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:#FFFDF6;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line);font-size:17px}

.colgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.panel .btnRed{width:100%;margin-top:16px}
.panel .btnInk{width:100%;margin-top:10px}
.fine{font-size:14px;color:var(--muted)}

.pl{display:flex;gap:8px;align-items:center;margin-top:8px}
.pl input{flex:1;width:auto;min-width:0}
.pl .dot{width:14px;height:14px;border-radius:50%;background:var(--pc);flex:none}
.pl .sbtn{flex:none;min-height:46px;padding:0 16px;white-space:nowrap}
.pl button:not(.sbtn){width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;color:var(--text);font:600 20px var(--f-ui)}
.charcard{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:rgba(42,29,18,.06)}

.charcard b{display:block;font:700 19px var(--f-ui)}
.charcard q{display:block;font:500 21px/1.15 var(--f-hand);color:var(--muted)}
.charcard .dots i{background:rgba(42,29,18,.18)}.charcard .dots i.on{background:#B08F00}

/* results, review, receipt */

.receipt .c{text-align:center}
.receipt .b{font-weight:700}

.scanbox{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;background:#000;border-radius:12px;overflow:hidden}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:var(--slip);color:var(--text);font:600 15px var(--f-ui);box-shadow:0 8px 20px -6px var(--shadow);animation:pop .2s ease-out}

.langlist button{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line-strong);background:transparent;color:var(--text);font:600 17px var(--f-ui)}
.langlist button[aria-pressed="true"]{background:var(--text);color:var(--slip)}
.howto dl{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px 10px;margin:0}
.howto dt{font:700 20px/1.3 var(--f-ui);text-align:center}
.howto dd{margin:0;line-height:1.45}
.howto table{margin-top:4px}
.howto td,.howto th{height:auto;border-left:0;text-align:left;padding:7px 0;vertical-align:top;line-height:1.4}
.howto th{width:36%;font:700 15px var(--f-ui);padding-right:10px}
/* feel: presses, entrances and effects */
button{transition:scale .2s cubic-bezier(.34,1.56,.64,1),filter .15s ease}
button.pressing:not(:disabled){scale:.95;filter:brightness(.93);transition-duration:.07s}
.die{transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,scale .12s ease}
.die.pressing:not(:disabled){scale:.9}
.cell.pressing:not(:disabled){scale:.94}
.glass.pressing:not(:disabled){scale:.98}

.dslot:nth-child(2) .die.tumble{animation-delay:-.12s}.dslot:nth-child(3) .die.tumble{animation-delay:-.3s}.dslot:nth-child(4) .die.tumble{animation-delay:-.05s}.dslot:nth-child(5) .die.tumble{animation-delay:-.22s}.dslot:nth-child(6) .die.tumble{animation-delay:-.4s}
@keyframes tumble{0%{translate:0 0;rotate:var(--spin,0deg)}20%{translate:-3px -26px;rotate:calc(var(--spin,0deg) - 120deg)}45%{translate:2px 2px;rotate:calc(var(--spin,0deg) + 60deg)}65%{translate:-1px -12px;rotate:calc(var(--spin,0deg) - 50deg)}85%{translate:1px 1px;rotate:calc(var(--spin,0deg) + 20deg)}100%{translate:0 0;rotate:var(--spin,0deg)}}
.die.flip{animation:flip .3s ease}
/* the dice cup (art/cup.webp): free dice shrink into it, it shakes, tips, and they pop back out */
.cup{position:fixed;z-index:45;display:none;pointer-events:none;transform-origin:50% 92%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.55))}
.cup img{display:block;width:100%;height:100%;transform-origin:50% 90%;-webkit-user-drag:none}
.die.incup{opacity:0;scale:.3}
.dslot .die{transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,scale .24s cubic-bezier(.34,1.56,.64,1),opacity .16s ease}
@keyframes flip{0%{opacity:.25;filter:brightness(1.4)}100%{opacity:1;filter:none}}
.die.landed{animation:landed .34s cubic-bezier(.3,1.5,.5,1) both}
@keyframes landed{0%{translate:0 -12px;scale:1.06}55%{translate:0 0;scale:1.08 .9}100%{translate:0 0;scale:1}}
.enter{animation:screenIn .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.trayin{animation:trayIn .42s cubic-bezier(.2,.9,.25,1) both}
@keyframes trayIn{from{translate:0 100%}to{translate:0 0}}
.modal:not([hidden]) .scrim{animation:fadeIn .24s ease both}
.modal.closing{pointer-events:none}
.modal.closing .panel{animation:sink .2s ease-in forwards}
.modal.closing .scrim{animation:fadeOut .2s ease-in forwards}
@keyframes sink{to{transform:translateY(80px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.chip.bump{animation:bump .46s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{scale:1.09}}
.fxshake{animation:fxshake .45s ease}
@keyframes fxshake{15%{translate:-6px 2px}30%{translate:6px -2px}45%{translate:-4px 1px}60%{translate:3px -1px}80%{translate:-1px 0}}
.fxcanvas{position:fixed;inset:0;pointer-events:none;z-index:70}
.fxfloat{position:fixed;z-index:65;pointer-events:none;transform:translate(-50%,-50%);font:700 36px/1 var(--f-hand);color:var(--chalk-y,#FFE27A);text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.55);animation:floatUp 1s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.fxfloat.zero{color:rgba(236,238,230,.7)}
@keyframes floatUp{0%{opacity:0;translate:0 6px;scale:.6}18%{opacity:1;scale:1.18}100%{opacity:0;translate:0 -60px;scale:1}}
.fxbanner{position:fixed;left:50%;bottom:calc(var(--tray-h,230px) + 22px);transform:translateX(-50%);z-index:66;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:160px;max-width:calc(100% - 48px);padding:10px 22px 11px;border-radius:12px;background:var(--slip);color:var(--text);box-shadow:0 14px 30px -10px rgba(0,0,0,.6),inset 0 -4px 0 var(--bc,var(--red));
  animation:bannerIn .42s cubic-bezier(.2,1.35,.4,1) both}
.fxbanner b{font:700 34px/1.05 var(--f-hand);color:var(--bc,var(--text));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxbanner span{font:700 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fxbanner.out{animation:bannerOut .36s ease-in forwards}
@keyframes bannerIn{from{opacity:0;translate:0 24px;scale:.9}to{opacity:1;translate:0 0;scale:1}}
@keyframes bannerOut{to{opacity:0;translate:0 -16px}}
.gstats{width:100%;margin:6px 0 10px;border-collapse:collapse;table-layout:auto;font:600 14px var(--f-ui);color:var(--text)}
.gstats th{font:700 10.5px var(--f-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);height:auto;padding:4px 2px;border-bottom:1.5px solid var(--line-strong);position:static;background:none;vertical-align:bottom}
.gstats td{height:auto;padding:7px 2px;border-bottom:1px solid var(--line);border-left:0;text-align:center}
.gstats td.nm{text-align:left;color:var(--pc);font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gstats small{font-size:10px;color:var(--muted)}
.stat3.stat4{grid-template-columns:repeat(4,1fr)}
.fact{margin:12px 0 4px;padding:12px 14px;border-radius:10px;background:#FFF6D6;box-shadow:inset 0 0 0 1.5px rgba(176,143,0,.35)}
.fact .fk{display:block;font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#8A6D00}
.fact p{margin:4px 0 0;font:500 22px/1.2 var(--f-hand);color:var(--text)}
.rec{display:flex;align-items:center;gap:12px;padding:10px 0 2px}
.rec .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rec .rt b{font:700 16px var(--f-ui)}
.rec .rt span{font-size:14px;color:var(--muted)}
.rec .rs{font:800 26px var(--f-serif);font-variant-numeric:lining-nums;color:var(--ink)}
.recm{margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:8px}
.clockgrp{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.clock{font:700 17px var(--f-ui);letter-spacing:.04em;color:var(--cream);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.clock.low{color:var(--red-lite);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.pzbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--cream-line);background:transparent;color:var(--cream);display:grid;place-items:center;padding:0}
.pzbtn svg{width:14px;height:14px}
.clockline{height:3px;border-radius:2px;background:rgba(246,238,220,.14);overflow:hidden;margin:-4px 0 0}
.clockline i{display:block;height:100%;background:var(--gold);transform-origin:left center;transition:transform .25s linear}
.rdyrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rdy{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--pc);background:transparent;color:var(--cream);font:700 15px var(--f-ui)}
.rdy.on{background:var(--pc);color:#fff}
.rdy:disabled{opacity:.6}
.sright{display:inline-flex;align-items:center;gap:8px;margin-left:auto;position:relative}
.sright .clockgrp{margin-left:0}
.emobtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--cream-line);background:transparent;color:var(--cream);display:grid;place-items:center;padding:0}
.emobtn svg{width:19px;height:19px}
.emobtn.open{background:var(--cream);color:var(--text)}
.emobtn.cool{opacity:.45}
.emopop{position:absolute;right:0;bottom:calc(100% + 10px);z-index:30;width:min(282px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;border-radius:14px;background:var(--slip);box-shadow:0 14px 30px -8px rgba(0,0,0,.6);animation:pop .18s ease-out;text-transform:none;letter-spacing:0}
.emopop button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0;padding:6px 2px 7px;border:0;border-radius:10px;background:#FFFDF6;box-shadow:inset 0 0 0 1px var(--line);color:var(--text)}
.emopop button:disabled{opacity:.4}
.emopop .es{width:58px;height:58px;transition:transform .15s ease-out;-webkit-user-drag:none}
.emopop button:active .es{transform:scale(.88)}
@media (hover:hover){.emopop button:not(:disabled):hover .es{transform:scale(1.08) rotate(-3deg)}}
.emopop .el{font:600 11px/1.1 var(--f-ui);text-align:center}
.emopop .emomute{grid-column:1/-1;min-height:34px;flex-direction:row;justify-content:center;font:700 12px var(--f-ui);letter-spacing:.01em;color:var(--muted);background:transparent;box-shadow:none}
.emo{position:fixed;z-index:67;pointer-events:none;display:flex;flex-direction:column;align-items:center;max-width:calc(100% - 16px);rotate:var(--rot,0deg);animation:emoIn .42s cubic-bezier(.2,1.5,.4,1) both}
.emo .es{width:88px;height:88px;margin-bottom:-8px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.emo .el{position:relative;max-width:100%;padding:4px 11px;border-radius:14px;background:var(--slip);color:var(--text);font:600 13px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 14px -4px rgba(0,0,0,.55),inset 0 0 0 2px var(--pc)}
.emo.out{animation:emoOut .38s ease-in forwards}
@keyframes emoIn{from{opacity:0;translate:0 -16px;scale:.35}to{opacity:1;translate:0 0;scale:1}}
@keyframes emoOut{to{opacity:0;translate:0 -12px}}
/* short phones: a slimmer tray so more of the board shows */
.keys{display:none;margin:2px 0 0;font:500 12px var(--f-ui);color:var(--cream-dim);text-align:center}
.keys kbd{display:inline-block;min-width:18px;padding:1px 5px;margin:0 2px;border:1px solid var(--cream-line);border-radius:4px;font:600 11px var(--f-ui);color:var(--cream)}
.colh{all:unset;display:block;width:100%;cursor:pointer;text-align:center;border-radius:6px}
.colh:focus-visible{outline:2px solid var(--chalk-y);outline-offset:1px}
.tipcard{position:absolute;left:0;right:0;bottom:calc(100% + 10px);width:min(528px,calc(100% - 32px));margin:0 auto;box-sizing:border-box;display:flex;align-items:center;gap:12px;
  padding:12px 12px 12px 16px;border-radius:12px;background:#FBF6EA;color:var(--text);box-shadow:0 10px 26px -8px rgba(0,0,0,.55);animation:tipIn .35s cubic-bezier(.2,.9,.25,1) both}
.tipcard p{margin:0;flex:1;font:500 15px/1.38 var(--f-ui)}
.tipcard .sbtn{flex:none;background:var(--text);color:var(--slip)}
.tipcard.inline{position:static;width:auto;margin:0 0 12px;box-shadow:none;border:1.5px dashed var(--line-strong);animation:none}
@keyframes tipIn{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.tipcard{animation:none}}
/* desktop and tablet in landscape: the sheet on the left, the dice tray as a panel on the right */
@media (min-width:1000px) and (min-aspect-ratio:4/3){
  #game .wrap{max-width:560px;margin-left:max(24px,calc(50% - 540px));margin-right:auto}
  .sheetWrap{padding-bottom:24px}
  .tray{left:calc(max(24px,50% - 540px) + 592px);right:auto;width:min(440px,calc(100vw - max(24px,50% - 540px) - 616px));top:50%;bottom:auto;transform:translateY(-50%);
    border:3px solid rgba(0,0,0,.35);border-radius:18px;padding-block:18px;box-shadow:0 18px 40px -12px var(--shadow)}
  .trayIn{max-width:none}
  .keys{display:block}
}
@media (max-height:800px){
  .bubbleRow{margin-bottom:4px}
  .bubbleRow .cmini.big{width:42px;height:42px}
  .bubble{font-size:16px;padding:6px 10px}
  .tray{padding-block:6px calc(8px + env(safe-area-inset-bottom,0px))}
  .trayIn{gap:6px}
  .die{--d:clamp(38px,11vw,48px)}
  .dice{min-height:54px;padding:14px 6px 8px}
  .die.held{transform:translateY(-11px) scale(1.07)}
  .glass{min-height:52px}
  .hintbtn{width:52px;min-height:52px}
  .glass small{display:none}
  .hint{font-size:14px;line-height:1.2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.die.flip{animation:flip .3s ease!important}}
</style>

<body>
<div id="home" hidden></div>
<div id="game" hidden></div>
<section class="tray" id="tray" hidden></section>
<div id="modal" class="modal" hidden><div class="scrim" data-act="close"></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:24px">Yamb Café needs JavaScript to run.</p></noscript>

<script>
(function(){
  const show=msg=>{
    let el=document.getElementById('errbar');
    if(!el){el=document.createElement('div');el.id='errbar';el.setAttribute('role','alert');
      el.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99;padding:10px 12px;border-radius:10px;background:#A3401A;color:#fff;font:600 14px/1.4 system-ui,sans-serif';
      el.addEventListener('click',()=>el.remove());document.body.appendChild(el);}
    el.textContent='Something went wrong: '+msg+' (v6.4)';
  };
  window.addEventListener('error',e=>{if(e.message)show(e.message);});
  window.addEventListener('unhandledrejection',e=>show(String(e.reason&&e.reason.message||e.reason)));
})();
</script>
