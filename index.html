<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jamb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Jamb for Two</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23FFFCF2' stroke='%2318212E' stroke-width='4'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%2318212E'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23C0302A'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%2318212E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one squared-notebook score sheet per player, written in that player's ballpoint ink;
   an ink-blue dice tray stays docked to the bottom edge. Two sheets side by side on wide screens. */
:root{
  --bg:#E9EDF1;
  --sheet:#FCFDFA;
  --grid:rgba(60,115,185,.13);
  --rule:rgba(27,45,72,.18);
  --rule-strong:rgba(27,45,72,.48);
  --margin:#E27474;
  --ink:#1A2433;
  --muted:#5B6878;
  --graphite:#6F7A88;
  --pen1:#1C4DB5;
  --pen2:#C0302A;
  --hl:rgba(255,220,50,.55);
  --hl-strong:rgba(255,206,0,.85);
  --sum-bg:rgba(27,45,72,.045);
  --err:#A3401A;
  --ok:#2E9E5B;
  --waitc:#C99A00;
  --marker:#FFE04A;
  --marker-edge:#C9A800;
  --tray:#152C47;
  --tray-2:#25507D;
  --tray-fg:#EAF0F7;
  --tray-muted:#A9B9CC;
  --tray-line:rgba(234,240,247,.28);
  --tray-err:#FFC983;
  --tray-ok:#8EE0AE;
  --pen1-lite:#93B6FF;
  --pen2-lite:#FF9087;
  --die:#FFFCF2;
  --die-edge:#D5CBB4;
  --pip:#18212E;
  --pip-one:#C0302A;
  --btn-ink:#18212E;
  --warn-ink:#9A3E10;
  --scrim:rgba(8,16,28,.55);
  --shadow:rgba(16,34,60,.30);
  --font-hand:'Kalam','Segoe Print','Bradley Hand',cursive;
  --font-ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --sheet:#151B23; --grid:rgba(120,160,220,.075); --rule:rgba(205,218,236,.14); --rule-strong:rgba(205,218,236,.4);
    --margin:#9A4646; --ink:#E5EAF1; --muted:#9AA7B7; --graphite:#8E99A8; --pen1:#82A9FF; --pen2:#FF8074;
    --hl:rgba(255,220,50,.2); --hl-strong:rgba(255,206,0,.4); --sum-bg:rgba(205,218,236,.04); --err:#FF9C6B; --ok:#4CC37E; --waitc:#E6B800;
    --tray:#0A1626; --tray-2:#1A3657; --tray-line:rgba(234,240,247,.22);
    --die:#EEE8DA; --die-edge:#B3A88F; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --sheet:#151B23; --grid:rgba(120,160,220,.075); --rule:rgba(205,218,236,.14); --rule-strong:rgba(205,218,236,.4);
  --margin:#9A4646; --ink:#E5EAF1; --muted:#9AA7B7; --graphite:#8E99A8; --pen1:#82A9FF; --pen2:#FF8074;
  --hl:rgba(255,220,50,.2); --hl-strong:rgba(255,206,0,.4); --sum-bg:rgba(205,218,236,.04); --err:#FF9C6B; --ok:#4CC37E; --waitc:#E6B800;
  --tray:#0A1626; --tray-2:#1A3657; --tray-line:rgba(234,240,247,.22);
  --die:#EEE8DA; --die-edge:#B3A88F; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.p0{--pen:var(--pen1)}
.p1{--pen:var(--pen2)}

.app{max-width:560px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(4px + env(safe-area-inset-top,0px)) calc(var(--tray-h,250px) + 24px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.word{font:700 32px/1 var(--font-hand);color:var(--ink);letter-spacing:.01em}
.sub{font:600 13px var(--font-ui);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{appearance:none;background:transparent;border:1px solid var(--rule-strong);border-radius:999px;color:var(--ink);
  font:600 14px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;padding:0 12px;min-height:36px;cursor:pointer}
.tools button:focus-visible{outline:2px solid var(--pen1);outline-offset:2px}
@media (max-width:420px){.sub{display:none}.tools{gap:5px}.tools button{padding:0 9px;font-size:13px;letter-spacing:.04em}.word{font-size:28px}}

/* two-phone banner */
.banner{display:flex;align-items:center;gap:10px;margin-block:4px 6px;padding:7px 7px 7px 12px;border-radius:10px;background:var(--sheet);
  border:1.5px dashed var(--rule-strong);font:600 15px var(--font-ui);letter-spacing:.03em;color:var(--ink)}
.banner .bt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}
.dot.wait{background:var(--waitc)}
.sbtn{flex:none;appearance:none;border:0;border-radius:9px;min-height:38px;padding:0 14px;background:var(--marker);color:var(--btn-ink);
  font:700 15px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;box-shadow:0 2px 0 var(--marker-edge)}
.sbtn.ghosty{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.sbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* score tabs (narrow) */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:8px 14px}
.tab{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:end;column-gap:8px;
  text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:9px 12px 8px;color:var(--ink);cursor:pointer}
.tab .tn{grid-column:1;grid-row:1;font:600 15px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tp{grid-column:1;grid-row:2;min-height:16px;font:600 12px var(--font-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--pen)}
.tab .tt{grid-column:2;grid-row:1 / span 2;position:relative;font:700 30px/1 var(--font-hand);color:var(--pen);font-variant-numeric:tabular-nums}
.tab.viewed{border-color:var(--pen);box-shadow:inset 0 -3px 0 var(--pen)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.you{font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.winner .tt::after,.winner .cap-s::after{content:"";position:absolute;inset:-7px -11px;border:2px solid var(--pen);border-radius:50%;transform:rotate(-5deg)}

/* sheets */
.sheets{display:grid;gap:28px}
.cap{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding-inline:2px}
.cap-n{font:600 18px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cap-t{font:600 13px var(--font-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--pen);white-space:nowrap}
.cap-s{position:relative;margin-left:auto;font:700 34px/1 var(--font-hand);color:var(--pen);font-variant-numeric:tabular-nums}
@media (max-width:859px){.sheet.is-off{display:none}.cap{display:none}}
@media (min-width:860px){.app{max-width:1100px}.sheets{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}.tabs{display:none}}

.paper{background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:17px 17px;box-shadow:0 0 0 1px var(--rule),0 16px 32px -22px var(--shadow)}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{height:34px;padding:0;text-align:center;vertical-align:middle;border-bottom:1px solid var(--rule)}
td{border-left:1px solid var(--rule)}
th.lab + td{border-left:0}
thead th{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--sheet);height:44px;vertical-align:bottom;padding-bottom:5px;border-bottom:1.5px solid var(--rule-strong)}
thead th + th{border-left:1px solid var(--rule)}
.sym{display:block;font:600 21px/1 var(--font-ui);color:var(--ink)}
.cn{display:block;margin-top:3px;font:600 9.5px/1.2 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:2px}
th.lab{text-align:left;padding-left:8px;border-right:2px solid var(--margin);font:600 16px var(--font-ui);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4 thead th.lab{width:23%}
.c5 thead th.lab{width:19%}
.mini{display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:20px;height:20px;padding:2.5px;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:5px;vertical-align:middle}
.mini i{width:3.4px;height:3.4px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.mini i.on{visibility:visible}
tr.sum > *{background:var(--sum-bg);border-top:1px solid var(--rule-strong);height:30px;font:600 16px var(--font-ui);color:var(--ink)}
.midl{font-size:12px;letter-spacing:0}
tr.tot > *{border-top:3px double var(--rule-strong);border-bottom:0;height:42px;font:700 18px var(--font-ui);color:var(--ink)}
sup{font:600 11px var(--font-ui);color:var(--pen);margin-left:2px;vertical-align:6px}

.w{display:inline-block;font:400 21px/1 var(--font-hand);color:var(--pen);transform:rotate(var(--rot,0deg))}
.w.z{opacity:.72}
.w.just{animation:ink .5s ease-out both}
@keyframes ink{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

.cell{appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;background:transparent;width:100%;height:100%;min-height:33px;
  display:grid;place-items:center;position:relative;isolation:isolate;cursor:pointer;font:600 16px var(--font-ui);color:var(--ink);font-variant-numeric:tabular-nums}
.cell::before{content:"";position:absolute;inset:7px 5px;background:var(--hl);border-radius:4px 9px 5px 10px / 7px 3px 8px 4px;transform:skewX(-8deg);z-index:-1}
.cell.zero{color:var(--graphite)}
.cell.zero::before{opacity:.5}
.cell.call{color:var(--graphite)}
.cell.call::before{background:transparent;border:1.5px dashed var(--graphite);border-radius:50%;transform:none;inset:6px 10%}
.cell.sel{color:var(--ink)}
.cell.sel::before{background:var(--hl-strong);opacity:1}
.cell.sel::after{content:"";position:absolute;inset:3px;border:2px solid var(--pen);border-radius:8px}
.cell.ann::after{content:"";position:absolute;inset:4px 7%;border:2px solid var(--pen);border-radius:50%}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* dice tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;color:var(--tray-fg);
  background:radial-gradient(130% 100% at 50% -20%,var(--tray-2),var(--tray) 72%);
  border-radius:18px 18px 0 0;box-shadow:0 -12px 32px -12px var(--shadow);
  padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));--pen-lite:var(--pen1-lite)}
body[data-cur="1"] .tray{--pen-lite:var(--pen2-lite)}
.tray-in{max-width:552px;margin:0 auto;box-sizing:border-box;display:grid;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;font:600 15px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--tray-muted)}
.st-l{display:flex;gap:7px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
.who{color:var(--pen-lite);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;font:600 13px var(--font-ui);letter-spacing:.05em;color:var(--tray-fg);border:1.5px solid var(--pen-lite);border-radius:999px;padding:3px 10px}
.link{flex:none;appearance:none;background:none;border:0;color:var(--tray-fg);font:600 14px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px;padding:0 2px}
.link:focus-visible{outline:2px solid var(--marker);outline-offset:2px}

.dice{display:flex;justify-content:center;gap:clamp(8px,2.6vw,14px);padding-block:8px 2px}
.die{--d:clamp(46px,14.5vw,62px);width:var(--d);height:var(--d);flex:none;box-sizing:border-box;padding:calc(var(--d) * .14);border:0;border-radius:22%;
  background:var(--die);box-shadow:inset 0 -4px 0 var(--die-edge),0 3px 0 rgba(0,0,0,.35);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.die i{display:block;width:calc(var(--d) * .16);height:calc(var(--d) * .16);border-radius:50%;background:var(--pip);visibility:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.45)}
.die i.on{visibility:visible}
.die i.one{background:var(--pip-one);width:calc(var(--d) * .22);height:calc(var(--d) * .22)}
.die.held{transform:translateY(-7px);box-shadow:inset 0 -4px 0 var(--die-edge),0 0 0 3px var(--pen-lite),0 10px 0 rgba(0,0,0,.25)}
.die.idle{opacity:.26;box-shadow:inset 0 -4px 0 var(--die-edge)}
.die:disabled{cursor:default}
.die:focus-visible{outline:3px solid var(--marker);outline-offset:3px}
.die.tumble{animation:tumble .42s cubic-bezier(.3,.7,.4,1)}
@keyframes tumble{0%{transform:none}25%{transform:translateY(-10px) rotate(-18deg)}55%{transform:translateY(3px) rotate(12deg)}80%{transform:translateY(-2px) rotate(-4deg)}100%{transform:none}}

.hint{margin:0;text-align:center;min-height:20px;font:500 14px/1.4 var(--font-body);color:var(--tray-muted);text-wrap:balance}
.err-t{color:var(--tray-err)}
.ok-t{color:var(--tray-ok)}
.final{display:grid;justify-items:center;gap:2px}
.final b{font:700 27px/1.1 var(--font-hand);color:var(--tray-fg)}
.final span{font:600 15px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--tray-muted)}
.actions{display:flex;gap:8px}

.btn{appearance:none;border:0;border-radius:12px;min-height:52px;padding:0 14px;min-width:0;cursor:pointer;
  font:700 17px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{flex:1;background:var(--marker);color:var(--btn-ink);box-shadow:0 3px 0 var(--marker-edge)}
.btn.warn{flex:1;background:var(--die);color:var(--warn-ink);box-shadow:0 3px 0 var(--die-edge)}
.btn.ghost{flex:1;background:transparent;color:var(--tray-fg);box-shadow:inset 0 0 0 1.5px var(--tray-line)}
.btn.x2{flex:none;width:52px;padding:0;font:500 28px/1 var(--font-body)}
.btn.roll{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--die);color:var(--btn-ink);box-shadow:0 4px 0 var(--die-edge);font-size:21px;letter-spacing:.12em}
.btn.roll.wait{font-size:17px;letter-spacing:.06em}
.pips{display:inline-flex;gap:5px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--btn-ink)}
.pips i.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--btn-ink);opacity:.45}

/* dialogs */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;box-sizing:border-box;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;box-sizing:border-box;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--sheet);color:var(--ink);
  border-radius:14px;padding:18px 20px 24px;box-shadow:0 24px 60px -20px var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel h2{margin:0;font:700 24px/1.1 var(--font-ui);text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
.panel h3{margin:22px 0 2px;font:700 14px var(--font-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.panel p{margin:0 0 10px;line-height:1.55;max-width:62ch}
.panel .err{color:var(--err);font-weight:600}
.panel .okm{color:var(--ok);font-weight:600}
.x{flex:none;appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule-strong);background:transparent;color:var(--ink);font:500 22px/1 var(--font-body);cursor:pointer}
.x:focus-visible{outline:2px solid var(--pen1);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:11px;background:var(--bg);margin:4px 0 6px}
.seg button{appearance:none;border:0;border-radius:8px;min-height:40px;background:transparent;color:var(--muted);font:700 15px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--pen1);outline-offset:1px}
.cols{display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px 10px;margin:0}
.cols dt{font:700 20px/1.3 var(--font-ui);text-align:center}
.cols dd{margin:0;line-height:1.5}
.pts{width:100%;border-collapse:collapse;table-layout:auto}
.pts th,.pts td{height:auto;border-bottom:1px solid var(--rule);border-left:0;vertical-align:top}
.pts th{text-align:left;width:34%;padding:8px 10px 8px 0;font:600 16px/1.35 var(--font-ui)}
.pts td{text-align:left;padding:8px 0;line-height:1.45}
.fine{font-size:13px;color:var(--muted)}
.field{display:grid;gap:6px;margin-top:14px}
.field span{font:600 13px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--pen1);vertical-align:1px}
.field.f2 span::before{background:var(--pen2)}
.field.plain span::before{display:none}
.field input,.linkbox{box-sizing:border-box;width:100%;font:500 17px var(--font-body);padding:11px 12px;border:1.5px solid var(--rule-strong);border-radius:9px;background:var(--bg);color:var(--ink)}
.field input:focus-visible,.linkbox:focus-visible{outline:2px solid var(--pen1);outline-offset:1px}
#joinCode{font:700 22px var(--font-ui);letter-spacing:.2em;text-transform:uppercase}
.linkbox{font-size:14px;margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;line-height:1.45;cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--pen1)}

let S=null,mode='local',online=null;
let prefs={lang:null,myName:null};
const ui={selected:null,rolling:false,justWrote:null,lastFocus:null,view:null,flick:false,msg:null,msgOk:false,msgT:0,seg:'one'};
const net={peer:null,conn:null,state:'idle',retryT:0,lastSeen:0,pendingS:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clone=o=>JSON.parse(JSON.stringify(o));
const tx=()=>L[prefs.lang]||L.en;
const name=p=>(S&&S.players[p]&&S.players[p].name)||tx().p(p+1);
const hasPeerLib=()=>typeof window.Peer==='function';

function loadPrefs(){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&typeof p==='object')prefs=Object.assign(prefs,p);}catch(e){}}
function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(prefs));}catch(e){}}
function loadLocal(){try{const raw=localStorage.getItem(KEY);if(raw){const st=JSON.parse(raw);if(valid(st))return st;}}catch(e){}return null;}
function saveLocal(){try{if(!isOnline())localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadOnline(){
  try{const o=JSON.parse(localStorage.getItem(OKEY)||'null');
    if(o&&typeof o.code==='string'&&/^[A-Z0-9]{5}$/.test(o.code)&&(o.seat===0||o.seat===1))return o;}catch(e){}
  return null;
}
function saveOnline(){
  try{
    if(online)localStorage.setItem(OKEY,JSON.stringify({code:online.code,seat:online.seat,S:onlineReady()?S:null}));
    else localStorage.removeItem(OKEY);
  }catch(e){}
}

function freshTurn(){return{roll:0,dice:[1,2,3,4,5],held:[false,false,false,false,false],announced:null};}
function newGame(names,hand,starter){
  const cols=hand?['down','up','free','ann','hand']:['down','up','free','ann'];
  const sheet=()=>{const o={};cols.forEach(c=>{o[c]={};ROWS.forEach(r=>{o[c][r]=null;});});return o;};
  const st=starter||0;
  return{v:1,cols,players:[0,1].map(i=>({name:names[i]||null,sheet:sheet()})),
    current:st,starter:st,view:st,turn:freshTurn(),undo:null,over:false};
}
function valid(st){
  return !!(st&&st.v===1&&Array.isArray(st.players)&&st.players.length===2&&Array.isArray(st.cols)&&st.turn&&
    Array.isArray(st.turn.dice)&&st.players.every(p=>p&&p.sheet&&st.cols.every(c=>p.sheet[c])));
}
function validGame(d){return valid(d)&&typeof d.code==='string'&&(!online||d.code===online.code);}
function rand(){
  try{const a=new Uint8Array(1);do{crypto.getRandomValues(a);}while(a[0]>=252);return a[0]%6+1;}
  catch(e){return 1+Math.floor(Math.random()*6);}
}
function makeCode(){
  const b=new Uint8Array(5);
  try{crypto.getRandomValues(b);}catch(e){for(let i=0;i<5;i++)b[i]=Math.floor(Math.random()*256);}
  let s='';b.forEach(x=>{s+=CODE_CHARS[x%CODE_CHARS.length];});return s;
}
const cleanCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
const hostId=code=>PEER_PREFIX+code.toLowerCase();
const shareUrl=()=>online?`${location.origin}${location.pathname}?game=${online.code}`:location.href;

/* scoring */
function counts(d){const c=[0,0,0,0,0,0,0];d.forEach(v=>{c[v]++;});return c;}
function score(row,d,roll){
  const c=counts(d),sum=d.reduce((a,b)=>a+b,0);
  if(UPPER.includes(row)){const v=+row;return c[v]*v;}
  if(row==='max'||row==='min')return sum;
  if(row==='kenta'){
    const s=[...new Set(d)].sort().join('');
    return (s==='12345'||s==='23456')?[66,56,46][Math.min(Math.max(roll,1),3)-1]:0;
  }
  const top=n=>{for(let v=6;v>=1;v--)if(c[v]>=n)return v;return 0;};
  if(row==='triling'){const v=top(3);return v?3*v+10:0;}
  if(row==='ful'){return((c.includes(3)&&c.includes(2))||c.includes(5))?sum+30:0;}
  if(row==='poker'){const v=top(4);return v?4*v+40:0;}
  if(row==='jamb'){const v=top(5);return v?5*v+50:0;}
  return 0;
}
function colCalc(col){
  const up=UPPER.reduce((a,r)=>a+(col[r]||0),0);
  const upAny=UPPER.some(r=>col[r]!==null);
  const bonus=up>=60?30:0;
  const mid=(col.max!==null&&col.min!==null&&col['1']!==null)?(col.max-col.min)*col['1']:null;
  const low=LOWER.reduce((a,r)=>a+(col[r]||0),0);
  const lowAny=LOWER.some(r=>col[r]!==null);
  const any=ROWS.some(r=>col[r]!==null);
  return{up,upAny,bonus,mid,low,lowAny,any,total:up+bonus+(mid||0)+low};
}
function total(p){return S.cols.reduce((a,c)=>a+colCalc(S.players[p].sheet[c]).total,0);}

/* who may act */
const isOnline=()=>mode==='online'&&!!online;
const onlineReady=()=>isOnline()&&validGame(S);
const mySeat=()=>isOnline()?online.seat:-1;
function mayAct(){
  if(!isOnline())return true;
  return onlineReady()&&S.status==='playing'&&S.current===online.seat;
}
function mayUndo(){
  if(!S.undo||S.turn.roll!==0)return false;
  if(!isOnline())return true;
  return onlineReady()&&S.undo.current===online.seat;
}
function getView(){return isOnline()?(ui.view===null?S.current:ui.view):S.view;}
function setView(p){if(isOnline())ui.view=p;else S.view=p;}

/* move legality */
function nextDown(col){return ROWS.find(r=>col[r]===null);}
function nextUp(col){for(let i=ROWS.length-1;i>=0;i--)if(col[ROWS[i]]===null)return ROWS[i];return undefined;}
function canWrite(p,c,r){
  if(!mayAct())return false;
  const t=S.turn,col=S.players[p].sheet[c];
  if(S.over||p!==S.current||t.roll<1||!col||col[r]!==null)return false;
  if(t.announced)return c==='ann'&&r===t.announced;
  if(c==='down')return nextDown(col)===r;
  if(c==='up')return nextUp(col)===r;
  if(c==='free')return true;
  if(c==='hand'||c==='ann')return t.roll===1;
  return false;
}
function hasOpenLater(){
  const sh=S.players[S.current].sheet;
  return ['down','up','free'].some(c=>sh[c]&&ROWS.some(r=>sh[c][r]===null));
}
function canRoll(){
  const t=S.turn;
  if(!mayAct()||S.over||ui.rolling||t.roll>=3)return false;
  if(t.roll===0||t.announced)return true;
  return hasOpenLater();
}
function isOver(){return S.players.every(pl=>S.cols.every(c=>ROWS.every(r=>pl.sheet[c][r]!==null)));}

/* saving: this phone only, or this phone plus the other one */
function save(){
  if(isOnline()){
    if(!onlineReady())return;
    S.rev=(S.rev||0)+1;S.updatedAt=Date.now();
    saveOnline();sendState();
  }else saveLocal();
}

/* actions */
let wl=null;
function wake(){
  try{
    if(wl||!navigator.wakeLock)return;
    navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null;});}).catch(()=>{});
  }catch(e){}
}
function doRoll(){
  if(!canRoll())return;
  const t=S.turn;
  if(t.roll===0)t.held=[false,false,false,false,false];
  S.undo=null;ui.selected=null;setView(S.current);
  const held=t.held.slice();
  const final=t.dice.map((v,i)=>held[i]?v:rand());
  wake();
  const finish=()=>{
    S.turn.dice=final;S.turn.roll++;ui.rolling=false;save();render();
    const pend=net.pendingS;net.pendingS=null;
    if(pend&&(pend.rev||0)>(S.rev||0))applyRemote(pend);
  };
  if(reduceMotion){finish();return;}
  ui.rolling=true;render();
  let n=0;
  const id=setInterval(()=>{
    S.turn.dice=S.turn.dice.map((v,i)=>held[i]?v:rand());
    tickDice();
    if(++n>=6){clearInterval(id);finish();}
  },65);
}
function toggleHold(i){
  const t=S.turn;
  if(!mayAct()||ui.rolling||S.over||t.roll<1||t.roll>=3)return;
  t.held[i]=!t.held[i];save();render();
}
function onCell(c,r){
  if(ui.rolling||!canWrite(S.current,c,r))return;
  const t=S.turn,sel=ui.selected;
  if(sel&&sel.c===c&&sel.r===r){
    if(c==='ann'&&!t.announced)return;
    doWrite(c,r);return;
  }
  ui.selected={c,r};render();
}
function doAnnounce(r){
  const t=S.turn;
  if(!mayAct()||t.roll!==1||t.announced)return;
  t.announced=r;ui.selected=null;save();render();
}
function doWrite(c,r){
  if(!canWrite(S.current,c,r))return;
  const t=S.turn;
  const snap=clone({players:S.players,current:S.current,turn:S.turn,over:S.over,view:S.view});
  S.players[S.current].sheet[c][r]=score(r,t.dice,t.roll);
  S.undo=snap;ui.selected=null;ui.justWrote={p:S.current,c,r};
  setView(S.current);
  if(isOver()){S.over=true;}else{S.current=1-S.current;S.turn=freshTurn();}
  if(isOnline())S.status=S.over?'over':'playing';
  save();render();
  setTimeout(()=>{ui.justWrote=null;},700);
}
function doUndo(){
  if(!mayUndo())return;
  const u=S.undo;
  S.players=u.players;S.current=u.current;S.turn=u.turn;S.over=u.over;S.view=u.view;
  if(isOnline()){S.status=S.over?'over':'playing';ui.view=S.current;}
  S.undo=null;ui.selected=null;ui.justWrote=null;save();render();
}
function rematch(){
  const names=S.players.map(p=>p.name),hand=S.cols.includes('hand');
  const g=newGame(names,hand,1-(S.starter||0));
  if(isOnline()){g.code=online.code;g.status='playing';g.rev=S.rev||0;ui.view=g.current;}
  S=g;ui.selected=null;save();render();
}

/* two phones: a direct link between the phones through PeerJS */
function setNet(s){net.state=s;renderBanner();renderOnline();if(S)renderTray();}
function retryLater(fn,ms){clearTimeout(net.retryT);net.retryT=setTimeout(fn,ms||3000);}
function destroyPeer(){
  clearTimeout(net.retryT);
  if(net.conn){const c=net.conn;net.conn=null;try{c.close();}catch(e){}}
  if(net.peer){const p=net.peer;net.peer=null;try{p.destroy();}catch(e){}}
}
function sendMsg(m){if(net.conn&&net.conn.open){try{net.conn.send(m);}catch(e){}}}
function sendState(){if(onlineReady())sendMsg({t:'state',S});}
function sendHello(){if(online)sendMsg({t:'hello',seat:online.seat,name:prefs.myName||null,S:onlineReady()?S:null});}

function ensurePeer(id,onOpen){
  if(net.peer&&!net.peer.destroyed&&net.peer.open&&(!id||net.peer.id===id)){onOpen();return;}
  destroyPeer();
  let peer;
  try{peer=id?new window.Peer(id,{debug:0}):new window.Peer({debug:0});}
  catch(e){setNet('unsupported');return;}
  net.peer=peer;
  peer.on('open',()=>{if(net.peer===peer)onOpen();});
  peer.on('connection',conn=>{
    if(net.peer===peer&&online&&online.seat===0)adoptConn(conn);
    else{try{conn.close();}catch(e){}}
  });
  peer.on('disconnected',()=>{
    if(net.peer!==peer||peer.destroyed)return;
    setTimeout(()=>{if(net.peer===peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect();}catch(e){}}},1500);
  });
  peer.on('error',err=>{
    if(net.peer!==peer||!online)return;
    const ty=err&&err.type;
    if(ty==='browser-incompatible'){setNet('unsupported');return;}
    if(ty==='peer-unavailable'){if(online.seat===1){setNet('hostAway');retryLater(connectGuest,4000);}return;}
    if(ty==='unavailable-id'||peer.destroyed){
      if(!(net.conn&&net.conn.open))setNet('opening');
      retryLater(online.seat===0?startHost:connectGuest,3000);return;
    }
    retryLater(()=>{
      if(net.peer===peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect();}catch(e){}}
      if(online&&online.seat===1&&!(net.conn&&net.conn.open))connectGuest();
    },3000);
  });
}
function startHost(){
  if(!online||online.seat!==0)return;
  if(!hasPeerLib()){setNet('off');return;}
  if(!(net.conn&&net.conn.open))setNet('opening');
  ensurePeer(hostId(online.code),()=>{setNet(net.conn&&net.conn.open?'connected':'waiting');});
}
function connectGuest(){
  if(!online||online.seat!==1)return;
  if(!hasPeerLib()){setNet('off');return;}
  clearTimeout(net.retryT);
  if(net.conn&&net.conn.open)return;
  if(net.state!=='hostAway')setNet('opening');
  ensurePeer(null,()=>{
    if(!online||online.seat!==1||(net.conn&&net.conn.open))return;
    if(net.conn){const c=net.conn;net.conn=null;try{c.close();}catch(e){}}
    let conn;
    try{conn=net.peer.connect(hostId(online.code),{reliable:true});}catch(e){retryLater(connectGuest,3000);return;}
    if(!conn){retryLater(connectGuest,3000);return;}
    adoptConn(conn);
    setTimeout(()=>{
      if(net.conn===conn&&!conn.open){net.conn=null;try{conn.close();}catch(e){}retryLater(connectGuest,2000);}
    },12000);
  });
}
function adoptConn(conn){
  if(net.conn&&net.conn!==conn){const old=net.conn;net.conn=null;try{old.close();}catch(e){}}
  net.conn=conn;
  const opened=()=>{
    if(net.conn!==conn)return;
    clearTimeout(net.retryT);net.lastSeen=Date.now();
    setNet('connected');sendHello();
  };
  conn.on('open',opened);
  conn.on('data',d=>{if(net.conn===conn){net.lastSeen=Date.now();onData(d);}});
  conn.on('close',()=>{
    if(net.conn!==conn)return;
    net.conn=null;
    if(!online)return;
    if(online.seat===1){setNet('opening');retryLater(connectGuest,1500);}
    else setNet(net.peer&&!net.peer.destroyed?'waiting':'opening');
  });
  conn.on('iceStateChanged',s=>{if(net.conn===conn&&(s==='failed'||s==='closed')){try{conn.close();}catch(e){}}});
  conn.on('error',()=>{});
  if(conn.open)opened();
}
function onData(d){
  if(!d||typeof d!=='object'||!online)return;
  if(d.t==='ping')return;
  if(d.t==='hello'){
    if(online.seat===0){
      if(!onlineReady())return;
      if(d.S&&validGame(d.S)&&(d.S.rev||0)>(S.rev||0))applyRemote(d.S);
      let changed=false;
      if(S.status==='waiting'){S.status='playing';changed=true;}
      const nm=typeof d.name==='string'?d.name.trim().slice(0,16):'';
      if(nm&&!S.players[1].name){S.players[1].name=nm;changed=true;}
      if(changed){save();render();}else sendState();
    }else if(d.S&&validGame(d.S))mergeState(d.S);
    return;
  }
  if(d.t==='state'&&d.S&&validGame(d.S))mergeState(d.S);
}
function mergeState(inS){
  const mine=onlineReady()?(S.rev||0):-1,r=inS.rev||0;
  if(r>mine)applyRemote(inS);
  else if(r<mine)sendState();
}
function applyRemote(d){
  if(!isOnline())return;
  if(ui.rolling){net.pendingS=d;return;}
  const old=onlineReady()?S:null;
  S=clone(d);
  if(old){
    if(S.current===old.current&&S.turn.roll>old.turn.roll)ui.flick=true;
    if(old.turn.roll===0&&S.turn.roll>0)ui.view=S.current;
    if(S.cols.length===old.cols.length){
      for(let p=0;p<2;p++)for(const c of S.cols)for(const row of ROWS){
        if(old.players[p].sheet[c][row]===null&&S.players[p].sheet[c][row]!==null){ui.justWrote={p,c,r:row};setTimeout(()=>{ui.justWrote=null;},700);}
      }
    }
  }
  if(ui.view===null)ui.view=S.current;
  if(ui.selected&&!canWrite(S.current,ui.selected.c,ui.selected.r))ui.selected=null;
  saveOnline();render();renderOnline();ui.flick=false;
}
setInterval(()=>{
  if(net.conn&&net.conn.open){
    sendMsg({t:'ping'});
    if(Date.now()-net.lastSeen>16000){try{net.conn.close();}catch(e){}}
  }
},5000);

function hostGame(){
  const t=tx();
  if(!hasPeerLib()){flash(t.onNoLib);return;}
  const nm=$('myName').value.trim().slice(0,16)||null;prefs.myName=nm;savePrefs();
  if(isOnline())leaveOnline(true);
  saveLocal();
  const code=makeCode();
  const g=newGame([nm,null],$('optHand2').checked,0);
  g.code=code;g.status='waiting';g.rev=1;g.updatedAt=Date.now();
  online={code,seat:0};mode='online';S=g;ui.view=0;ui.selected=null;
  saveOnline();startHost();render();renderOnline();
}
function joinGame(raw){
  const t=tx(),code=cleanCode(raw);
  if(code.length!==5){flash(t.errCode);return;}
  if(!hasPeerLib()){flash(t.onNoLib);return;}
  const nm=$('myName').value.trim().slice(0,16)||prefs.myName||null;prefs.myName=nm;savePrefs();
  if(isOnline())leaveOnline(true);
  saveLocal();
  online={code,seat:1};mode='online';
  S=newGame([null,nm],false,0);
  ui.view=null;ui.selected=null;
  saveOnline();closeModals();render();connectGuest();
}
function resumeOnline(sess){
  online={code:sess.code,seat:sess.seat};mode='online';
  S=validGame(sess.S)?sess.S:newGame([null,null],false,0);
  ui.view=null;
  if(!hasPeerLib()){net.state='off';return;}
  if(online.seat===0)startHost();else connectGuest();
}
function leaveOnline(silent){
  destroyPeer();
  online=null;mode='local';net.state='idle';net.pendingS=null;
  saveOnline();
  S=loadLocal()||newGame([null,null],false,0);ui.selected=null;ui.view=null;ui.rolling=false;
  if(!silent){render();renderOnline();}
}
function shareLink(){
  const t=tx(),url=shareUrl();
  if(navigator.share){
    navigator.share({title:'Jamb',text:t.shareText,url}).catch(e=>{if(!(e&&e.name==='AbortError'))copyLink();});
    return;
  }
  copyLink();
}
function copyLink(){
  const t=tx(),url=shareUrl();
  const done=()=>flash(t.copied,true);
  const fallback=()=>{
    const box=$('linkBox');
    if(box){box.focus();box.select();try{if(document.execCommand('copy'))done();}catch(e){}}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,fallback);
  else fallback();
}
function flash(msg,ok){
  ui.msg=msg;ui.msgOk=!!ok;clearTimeout(ui.msgT);
  ui.msgT=setTimeout(()=>{ui.msg=null;if(S){renderTray();renderOnline();}},4500);
  if(S){renderTray();renderOnline();}
}
function statusText(){
  const t=tx();
  switch(net.state){
    case 'connected':return t.connected(onlineReady()?name(1-online.seat):t.p(online.seat===0?2:1));
    case 'waiting':return t.waitingPhone;
    case 'hostAway':return t.hostAway(onlineReady()?name(0):t.p(1));
    case 'unsupported':case 'off':return t.notConnected;
    default:return t.opening;
  }
}
const dotCls=()=>net.state==='connected'?'ok':(net.state==='waiting'||net.state==='hostAway'?'wait':'');

/* rendering */
function labelHTML(r){
  const t=tx();
  if(UPPER.includes(r)){
    const on=FACE[+r];let pips='';
    for(let k=0;k<9;k++)pips+=`<i${on.includes(k)?' class="on"':''}></i>`;
    return `<span class="mini" aria-hidden="true">${pips}</span><span class="sr">${t.row[r]}</span>`;
  }
  return t.row[r];
}
function cellHTML(p,c,r){
  const t=tx(),v=S.players[p].sheet[c][r],tr=S.turn;
  if(v!==null){
    const jw=ui.justWrote,just=jw&&jw.p===p&&jw.c===c&&jw.r===r;
    const rot=((c.charCodeAt(0)*7+r.charCodeAt(0)*3+r.length*11)%7)-3;
    return `<span class="w${just?' just':''}${v===0?' z':''}" style="--rot:${rot}deg">${v}</span>`;
  }
  if(!ui.rolling&&canWrite(p,c,r)){
    const s=score(r,tr.dice,tr.roll),sel=ui.selected;
    const isSel=sel&&sel.c===c&&sel.r===r;
    const call=c==='ann'&&!tr.announced;
    const ann=c==='ann'&&tr.announced===r;
    const cls='cell'+(isSel?' sel':'')+(call?' call':'')+(ann?' ann':'')+(s===0&&!call?' zero':'');
    return `<button type="button" class="${cls}" data-act="cell" data-c="${c}" data-r="${r}" aria-label="${esc(t.row[r]+', '+t.colLong[c]+': '+s)}">${s}</button>`;
  }
  return '';
}
function sheetHTML(p){
  const t=tx(),pl=S.players[p],cols=S.cols,view=getView();
  const calc={};cols.forEach(c=>{calc[c]=colCalc(pl.sheet[c]);});
  const row=r=>`<tr><th scope="row" class="lab">${labelHTML(r)}</th>${cols.map(c=>`<td>${cellHTML(p,c,r)}</td>`).join('')}</tr>`;
  const sumRow=(cls,label,fn)=>`<tr class="${cls}"><th scope="row" class="lab">${label}</th>${cols.map(c=>`<td>${fn(calc[c])}</td>`).join('')}</tr>`;
  let h=`<thead><tr><th class="lab" scope="col"><span class="sr">${esc(name(p))}</span></th>${cols.map(c=>`<th scope="col" title="${esc(t.colLong[c])}"><span class="sym">${SYM[c]}</span><span class="cn">${t.col[c]}</span></th>`).join('')}</tr></thead><tbody>`;
  UPPER.forEach(r=>{h+=row(r);});
  h+=sumRow('sum',`Σ<span class="sr"> ${t.sumUp}</span>`,k=>k.upAny?`${k.up}${k.bonus?'<sup>+30</sup>':''}`:'');
  h+=row('max')+row('min');
  h+=sumRow('sum',`<span class="midl">${t.mid}</span>`,k=>k.mid===null?'':k.mid);
  LOWER.forEach(r=>{h+=row(r);});
  h+=sumRow('sum',`Σ<span class="sr"> ${t.sumLow}</span>`,k=>k.lowAny?k.low:'');
  h+=sumRow('tot',t.total,k=>k.any?k.total:'');
  h+='</tbody>';
  const a=total(0),b=total(1);
  const cur=!S.over&&S.current===p,win=S.over&&((p===0&&a>b)||(p===1&&b>a));
  const me=isOnline()&&online.seat===p;
  return `<section class="sheet p${p}${view===p?'':' is-off'}${win?' winner':''}" aria-label="${esc(t.sheetOf(name(p)))}">
    <div class="cap"><span class="cap-n">${esc(name(p))}${me?` <span class="you">(${t.youTag})</span>`:''}</span>${cur?`<span class="cap-t">${t.toPlay}</span>`:''}<span class="cap-s">${p?b:a}</span></div>
    <div class="paper"><table class="c${cols.length}">${h}</table></div></section>`;
}
function renderTabs(){
  const t=tx(),a=total(0),b=total(1),view=getView();
  $('tabs').innerHTML=[0,1].map(p=>{
    const cur=!S.over&&S.current===p,win=S.over&&((p===0&&a>b)||(p===1&&b>a));
    const me=isOnline()&&online.seat===p;
    return `<button type="button" class="tab p${p}${view===p?' viewed':''}${win?' winner':''}" data-act="tab" data-p="${p}" role="tab" aria-selected="${view===p}">
      <span class="tn">${esc(name(p))}${me?` <span class="you">(${t.youTag})</span>`:''}</span><span class="tt">${p?b:a}</span><span class="tp">${cur?t.toPlay:(win?t.winner:'')}</span></button>`;
  }).join('');
}
function renderSheets(){$('sheets').innerHTML=sheetHTML(0)+sheetHTML(1);}
function dieHTML(v,i,held,idle,can){
  const t=tx(),on=idle?[]:FACE[v];let pips='';
  for(let k=0;k<9;k++)pips+=`<i class="${on.includes(k)?'on':''}${v===1&&k===4&&!idle?' one':''}"></i>`;
  const tumble=(ui.rolling||ui.flick)&&!held&&!idle;
  return `<button type="button" class="die${held?' held':''}${idle?' idle':''}${tumble?' tumble':''}" data-act="hold" data-i="${i}" aria-pressed="${held}" aria-label="${esc(idle?t.dieIdle:t.die(v,held))}"${can?'':' disabled'}>${pips}</button>`;
}
function renderDice(){
  const tr=S.turn,idle=tr.roll===0&&!ui.rolling;
  const can=mayAct()&&!S.over&&!ui.rolling&&tr.roll>=1&&tr.roll<3;
  $('dice').innerHTML=tr.dice.map((v,i)=>dieHTML(v,i,tr.held[i]&&!idle,idle,can)).join('');
}
function tickDice(){
  const tr=S.turn;
  $('dice').querySelectorAll('.die').forEach((el,i)=>{
    if(tr.held[i])return;
    const v=tr.dice[i],on=FACE[v];
    el.querySelectorAll('i').forEach((p,k)=>{p.className=(on.includes(k)?'on':'')+(v===1&&k===4?' one':'');});
  });
}
function renderTray(){
  const t=tx(),tr=S.turn,cur=S.current;
  document.body.dataset.cur=String(cur);
  let st='',hint='',act='';
  const undoLink=mayUndo()?`<button type="button" class="link" data-act="undo">${t.undo}</button>`:'';
  const annChip=tr.announced?`<span class="chip">N · ${t.row[tr.announced]}</span>`:'';
  const whoLine=`<span class="st-l"><b class="who">${esc(name(cur))}</b><span>·</span><span>${tr.roll?t.rollOf(tr.roll):t.toPlay}</span></span>`;
  const idleBtn=label=>`<button type="button" class="btn roll wait" disabled><span>${esc(label)}</span></button>`;
  if(isOnline()&&!onlineReady()){
    st=`<span class="st-l">${esc(statusText())}</span>`;hint='&nbsp;';act=idleBtn(t.rollBtn);
  }else if(S.over){
    const a=total(0),b=total(1);
    st=`<span class="st-l">${t.over}</span>${undoLink}`;
    hint=`<span class="final"><b>${esc(a===b?t.draw:t.wins(name(a>b?0:1)))}</b><span>${esc(name(0))} ${a} : ${b} ${esc(name(1))}</span></span>`;
    act=`<button type="button" class="btn primary" data-act="rematch">${t.rematch}</button><button type="button" class="btn ghost" data-act="setup">${t.newGame}</button>`;
  }else if(isOnline()&&S.status==='waiting'){
    st=`<span class="st-l">${t.waitJoin}</span>`;hint=t.hWaitJoin;
    act=online.seat===0?`<button type="button" class="btn primary" data-act="share">${t.shareLink}</button>`:idleBtn(t.rollBtn);
  }else if(isOnline()&&!mayAct()){
    st=whoLine+(annChip||undoLink);
    hint=esc(t.hWaitTurn(name(cur)));
    act=idleBtn(t.waitTurn(name(cur)));
  }else{
    st=whoLine;
    if(annChip)st+=annChip;
    else if(undoLink)st+=undoLink;
    else if(!isOnline()&&tr.roll===0&&!S.players[0].name&&!S.players[1].name)st+=`<button type="button" class="link" data-act="names">${t.addNames}</button>`;
    const sel=ui.selected,selCall=sel&&sel.c==='ann'&&!tr.announced;
    if(ui.rolling)hint='&nbsp;';
    else if(tr.roll===0)hint=isOnline()?t.hStartOnline:t.hStart;
    else if(selCall)hint=t.hCall;
    else if(sel)hint=t.hSel;
    else if(tr.announced)hint=t.hAnn(t.row[tr.announced]);
    else if(tr.roll>=3)hint=t.hLast;
    else if(!hasOpenLater())hint=t.hMust;
    else hint=t.hHold;
    if(sel&&!ui.rolling){
      const s=score(sel.r,tr.dice,tr.roll),lab=t.row[sel.r],sym=SYM[sel.c];
      if(selCall){
        act=`<button type="button" class="btn primary" data-act="announce">${esc(t.announce(lab))}</button><button type="button" class="btn ghost" data-act="write">${esc(t.writeNow(s))}</button>`;
      }else{
        act=`<button type="button" class="btn ${s?'primary':'warn'}" data-act="write">${esc(s?t.write(s,lab,sym):t.scratch(lab,sym))}</button>`;
      }
      act+=`<button type="button" class="btn ghost x2" data-act="cancel" aria-label="${t.cancel}">×</button>`;
    }else{
      const pips=[0,1,2].map(k=>`<i class="${k<tr.roll?'used':''}"></i>`).join('');
      const dis=!canRoll()&&!ui.rolling;
      act=`<button type="button" class="btn roll" data-act="roll"${dis?' disabled':''}><span>${tr.roll?t.rollAgain:t.rollBtn}</span><span class="pips" aria-hidden="true">${pips}</span></button>`;
    }
  }
  if(ui.msg)hint=`<span class="${ui.msgOk?'ok-t':'err-t'}">${esc(ui.msg)}</span>`;
  $('status').innerHTML=st;$('hint').innerHTML=hint;$('actions').innerHTML=act;
  renderDice();
}
function renderBanner(){
  const b=$('banner'),t=tx();
  let h='';
  if(isOnline()){
    h=`<span class="dot ${dotCls()}"></span><span class="bt">${esc(statusText())} · ${esc(online.code)}</span>`;
    h+=(online.seat===0&&net.state!=='connected')
      ?`<button type="button" class="sbtn" data-act="share">${t.shareShort}</button>`
      :`<button type="button" class="sbtn ghosty" data-act="setup2">${t.gameBtn}</button>`;
  }
  b.innerHTML=h;b.hidden=!h;
}
function renderOnline(){
  if(!$('onlineBody'))return;
  const t=tx();
  let m='';
  if(!hasPeerLib())m=`<p class="err">${t.onNoLib}</p>`;
  else if(net.state==='unsupported')m=`<p class="err">${t.onUnsupported}</p>`;
  if(ui.msg)m+=`<p class="${ui.msgOk?'okm':'err'}">${esc(ui.msg)}</p>`;
  $('onMsg').innerHTML=m;
  $('onForm').hidden=isOnline()||!hasPeerLib();
  $('hostPart').hidden=!!ui.joinOnly;
  $('onSession').hidden=!isOnline();
  if(isOnline()){
    const url=shareUrl();
    $('onSession').innerHTML=`<p class="fine" style="margin:6px 0 0">${t.sessCode}</p><div class="code">${esc(online.code)}</div>
      <p class="conn"><span class="dot ${dotCls()}"></span>${esc(statusText())}</p>
      ${online.seat===0?`<p>${t.sendLink}</p><input class="linkbox" id="linkBox" readonly value="${esc(url)}" aria-label="${esc(t.shareLink)}">
      <div class="row2"><button type="button" class="btn primary" data-act="share">${t.shareLink}</button><button type="button" class="btn ghost" data-act="copy">${t.copyLink}</button></div>`:''}
      <button type="button" class="btn ghost" data-act="leave">${t.leave}</button>`;
  }else $('onSession').innerHTML='';
}
const keyOf=e=>[e.dataset.act,e.dataset.i||'',e.dataset.c||'',e.dataset.r||'',e.dataset.p||''].join('|');
function render(){
  const a=document.activeElement,key=a&&a.dataset&&a.dataset.act?keyOf(a):null;
  renderTabs();renderSheets();renderTray();renderBanner();
  if(key){
    const el=[...document.querySelectorAll('[data-act]')].find(e=>keyOf(e)===key);
    if(el&&!el.disabled){try{el.focus({preventScroll:true});}catch(e){}}
  }
}
function applyStatic(){
  const t=tx();
  document.documentElement.lang=prefs.lang||'en';
  $('sub').textContent=t.sub;$('btnRules').textContent=t.rules;$('btnNew').textContent=t.newGame;
  $('btnNames').textContent=t.names;$('namesTitle').textContent=t.namesTitle;$('saveNamesBtn').textContent=t.saveNames;
  $('m1').textContent=t.p(1);$('m2').textContent=t.p(2);$('q1name').placeholder=t.p(1);$('q2name').placeholder=t.p(2);
  $('btnLang').textContent=t.langBtn;$('btnLang').setAttribute('aria-label',t.langLabel);
  $('rulesTitle').textContent=t.rulesTitle;$('rulesBody').innerHTML=t.rulesHTML;
  $('setupTitle').textContent=t.setupTitle;$('segOne').textContent=t.segOne;$('segTwo').textContent=t.segTwo;
  $('l1').textContent=t.p(1);$('l2').textContent=t.p(2);
  $('p1name').placeholder=t.p(1);$('p2name').placeholder=t.p(2);
  $('lHand').textContent=t.optHand;$('setupNote').textContent=t.setupNote;$('startBtn').textContent=t.start;
  $('lMyName').textContent=t.yourName;$('lHand2').textContent=t.optHand;$('startOnlineBtn').textContent=t.startOnline;
  $('orJoin').textContent=t.orJoin;$('lCode').textContent=t.codeLabel;$('joinBtn').textContent=t.joinBtn;
  $('onNote').textContent=t.onlineNote;
  $('tray').setAttribute('aria-label',prefs.lang==='hr'?'Kocke':'Dice');
  document.querySelectorAll('.x').forEach(b=>b.setAttribute('aria-label',t.close));
}

/* dialogs */
function openModal(id,focusEl){
  ui.lastFocus=document.activeElement;
  $(id).hidden=false;
  const f=focusEl||$(id).querySelector('.x');if(f){try{f.focus();}catch(e){}}
}
function closeModals(){
  ['rulesModal','setupModal','namesModal'].forEach(id=>{$(id).hidden=true;});
  if(ui.lastFocus&&ui.lastFocus.focus){try{ui.lastFocus.focus();}catch(e){}}
}
function openNames(){
  $('q1name').value=S.players[0].name||'';
  $('q2name').value=S.players[1].name||'';
  openModal('namesModal',$('q1name'));
}
function applySeg(){
  const two=ui.seg==='two';
  $('segOne').setAttribute('aria-selected',String(!two));$('segTwo').setAttribute('aria-selected',String(two));
  $('setupForm').hidden=two;$('onlineBody').hidden=!two;
}
function openSetup(seg,focusEl,joinOnly){
  ui.seg=seg||(isOnline()?'two':'one');
  ui.joinOnly=!!joinOnly;
  const loc=isOnline()?loadLocal():S;
  $('p1name').value=(loc&&loc.players[0].name)||'';
  $('p2name').value=(loc&&loc.players[1].name)||'';
  $('optHand').checked=!!(loc&&loc.cols.includes('hand'));
  $('myName').value=prefs.myName||'';
  $('optHand2').checked=false;
  applySeg();renderOnline();openModal('setupModal',focusEl);
}

function bind(){
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    switch(el.dataset.act){
      case 'roll':doRoll();break;
      case 'hold':toggleHold(+el.dataset.i);break;
      case 'cell':onCell(el.dataset.c,el.dataset.r);break;
      case 'write':if(ui.selected)doWrite(ui.selected.c,ui.selected.r);break;
      case 'announce':if(ui.selected)doAnnounce(ui.selected.r);break;
      case 'cancel':ui.selected=null;render();break;
      case 'undo':doUndo();break;
      case 'tab':setView(+el.dataset.p);if(!isOnline())save();render();break;
      case 'rules':openModal('rulesModal');break;
      case 'setup':openSetup();break;
      case 'setup2':openSetup('two');break;
      case 'seg':ui.seg=el.dataset.s;applySeg();renderOnline();break;
      case 'names':openNames();break;
      case 'lang':prefs.lang=prefs.lang==='hr'?'en':'hr';savePrefs();applyStatic();render();renderOnline();break;
      case 'close':closeModals();break;
      case 'rematch':rematch();break;
      case 'joincode':joinGame($('joinCode').value);break;
      case 'share':shareLink();break;
      case 'copy':copyLink();break;
      case 'leave':closeModals();leaveOnline();break;
    }
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
  $('joinCode').addEventListener('input',e=>{const v=cleanCode(e.target.value);if(v!==e.target.value)e.target.value=v;});
  $('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();joinGame($('joinCode').value);}});
  $('namesForm').addEventListener('submit',e=>{
    e.preventDefault();
    if(isOnline()&&!onlineReady()){closeModals();return;}
    S.players[0].name=$('q1name').value.trim().slice(0,16)||null;
    S.players[1].name=$('q2name').value.trim().slice(0,16)||null;
    if(isOnline()&&S.players[online.seat].name){prefs.myName=S.players[online.seat].name;savePrefs();}
    save();closeModals();render();
  });
  $('setupForm').addEventListener('submit',e=>{
    e.preventDefault();
    const n1=$('p1name').value.trim().slice(0,16)||null,n2=$('p2name').value.trim().slice(0,16)||null;
    const hand=$('optHand').checked;
    if(isOnline())leaveOnline(true);
    S=newGame([n1,n2],hand,0);ui.selected=null;ui.justWrote=null;
    save();closeModals();render();renderOnline();
  });
  $('onForm').addEventListener('submit',e=>{e.preventDefault();hostGame();});
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible')return;
    if(S&&S.turn.roll>0)wake();
    if(!isOnline()||!hasPeerLib())return;
    if(online.seat===1){if(!(net.conn&&net.conn.open))connectGuest();}
    else if(!net.peer||net.peer.destroyed)startHost();
    else if(net.peer.disconnected){try{net.peer.reconnect();}catch(e){}}
  });
  try{
    const ro=new ResizeObserver(()=>{document.documentElement.style.setProperty('--tray-h',$('tray').offsetHeight+'px');});
    ro.observe($('tray'));
  }catch(e){}
}

function start(){
  loadPrefs();
  let st=loadLocal();
  if(!prefs.lang){
    prefs.lang=(st&&st.lang)||((navigator.language||'').toLowerCase().startsWith('hr')?'hr':'en');
    savePrefs();
  }
  if(!valid(st))st=newGame([null,null],false,0);
  S=st;mode='local';
  bind();applyStatic();
  let jc='';
  try{
    jc=cleanCode(new URLSearchParams(location.search).get('game'));
    if(location.search)history.replaceState(null,'',location.pathname+location.hash);
  }catch(e){}
  const sess=loadOnline();
  if(sess&&(!jc||jc===sess.code))resumeOnline(sess);
  render();renderOnline();
  if(jc&&jc.length===5&&!(sess&&sess.code===jc)){
    $('joinCode').value=jc;
    openSetup('two',$('myName'),true);
  }
}
start();
})();
</script>
</body>
