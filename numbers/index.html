<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Numbers · Yamb Café</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{--espresso:#2A1A12;--walnut:#4A2F1C;--coffee:#522E16;--brass:#C9A24B;--red:#C33426;--paper:#FBF6EC;--ok:#4E7A55;--no:#A5532E}
*{box-sizing:border-box}
html{background:var(--walnut)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#3B2415,var(--walnut) 40%,#3B2415);color:var(--espresso);font:400 16px/1.5 'Alegreya Sans',system-ui,sans-serif;padding:24px 14px 48px}
.card{max-width:980px;margin:0 auto;background:var(--paper);border-radius:6px;padding:28px clamp(16px,4vw,40px) 32px;box-shadow:0 0 0 1px rgba(42,26,18,.25),0 0 0 7px var(--paper),0 0 0 8px rgba(42,26,18,.55),0 18px 40px rgba(0,0,0,.45)}
h1{font:800 34px/1.1 Alegreya,Georgia,serif;margin:0 0 4px}
h2{font:700 21px/1.25 Alegreya,Georgia,serif;margin:28px 0 8px;color:var(--coffee);padding-bottom:6px;border-bottom:1px solid rgba(201,162,75,.6)}
.sub{color:#6B5A45;margin:0 0 16px}
.range{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.range button{font:700 15px 'Alegreya Sans',sans-serif;border:0;border-radius:999px;padding:7px 14px;background:#EFE3CC;color:var(--espresso);cursor:pointer}
.range button[aria-pressed=true]{background:var(--espresso);color:#F0E1C2}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{background:#F3EAD8;border-radius:6px;padding:12px 14px;border-left:5px solid #CDBFA5}
.tile.ok{border-left-color:var(--ok)}.tile.no{border-left-color:var(--no)}
.tile b{display:block;font:800 30px/1.1 Alegreya,Georgia,serif;font-variant-numeric:lining-nums tabular-nums}
.tile span{display:block;font-weight:700}
.tile small{display:block;color:#6B5A45}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid rgba(42,26,18,.12);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--coffee);font-weight:700}
.wrap{overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 28px}
.cols th,.cols td{padding:6px 5px}
.chart{width:100%;height:auto;display:block;background:#F3EAD8;border-radius:6px}
.legend{font-size:14px;color:#6B5A45;margin:6px 0 0}.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin:0 5px 0 12px}
.funnel div{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:5px 0}
.funnel span.bar{height:20px;border-radius:4px;background:var(--brass);min-width:2px;display:block}
.funnel b{text-align:right;font-variant-numeric:tabular-nums}
.hours{display:flex;align-items:flex-end;gap:3px;height:90px;background:#F3EAD8;border-radius:6px;padding:8px 8px 0}
.hours i{flex:1;background:var(--coffee);border-radius:2px 2px 0 0;min-height:1px}
.hl{display:flex;justify-content:space-between;font-size:13px;color:#6B5A45;padding:2px 8px}
.msg{background:#F3EAD8;border-left:4px solid var(--brass);padding:12px 16px;border-radius:4px}
a{color:var(--red)}
</style>
</head>
<body>
<main class="card">
<h1>Numbers</h1>
<p class="sub">Yamb Café visitor and game counts. Totals only: the counter never knows who anyone is.</p>
<div class="range" id="range"></div>
<div id="out"><p class="msg">Loading…</p></div>
</main>
<script src="../vendor/supabase.js"></script>
<script src="../cloud.js"></script>
<script>
(function(){
'use strict';
const C=window.JambCloud,out=document.getElementById('out'),rangeEl=document.getElementById('range');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const day=d=>d.toISOString().slice(0,10);
const fmt=n=>n==null||isNaN(n)?'–':(Math.round(n*10)/10).toLocaleString('en-GB');
const pct=n=>n==null||isNaN(n)?'–':Math.round(n*100)+'%';
let span=30;
const RANGES=[[7,'7 days'],[30,'30 days'],[90,'90 days'],[365,'A year']];
function drawRange(){rangeEl.innerHTML=RANGES.map(([n,l])=>`<button type="button" data-n="${n}" aria-pressed="${n===span}">${l}</button>`).join('');}
rangeEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;span=+b.dataset.n;drawRange();load();});
drawRange();
function msg(h){out.innerHTML=`<p class="msg">${h}</p>`;}

// the KPIs from the plan: value, go sign, and whether it is met
function tile(label,value,shown,goal,goalText,note){
  const cls=value==null||isNaN(value)?'':value>=goal?'ok':'no';
  return `<div class="tile ${cls}"><span>${esc(label)}</span><b>${shown}</b><small>Go sign: ${esc(goalText)}${note?' · '+esc(note):''}</small></div>`;
}
function render(N){
  const by={};const get=d=>by[d]||(by[d]={day:d,visitors:0,views:0,app:0,players:0,started:0,finished:0,daily:0});
  N.days.forEach(x=>{const r=get(x.day);r.visitors=x.people;r.views=x.views;r.app=x.app||0;});
  const evs={};
  N.events.forEach(x=>{
    const r=get(x.day);
    if(x.ev==='start'&&x.mode==='all'){r.players=x.people;r.started=x.n;}
    if(x.ev==='finish'&&x.mode==='all')r.finished=x.n;
    const k=x.ev+':'+x.mode;evs[k]=evs[k]||{n:0,people:0};evs[k].n+=x.n;evs[k].people+=x.people;
  });
  N.daily.forEach(x=>{get(x.day).daily=x.players;});
  const rows=Object.values(by).sort((a,b)=>a.day<b.day?1:-1);
  const live=rows.filter(r=>r.visitors>0||r.players>0);
  const avg=f=>live.length?live.reduce((s,r)=>s+f(r),0)/live.length:null;
  const sum=f=>rows.reduce((s,r)=>s+f(r),0);
  const started=sum(r=>r.started),finished=sum(r=>r.finished),visitors=sum(r=>r.visitors),app=sum(r=>r.app);
  const others=['pp','online','duel','table'].reduce((s,m)=>s+((evs['start:'+m]||{}).n||0),0);
  const today=day(new Date());
  const weeks=(N.weeks||[]).filter(w=>{const end=new Date(w.week);end.setUTCDate(end.getUTCDate()+14);return day(end)<=today;});
  const lastWeek=weeks[weeks.length-1];
  const since30=day(new Date(Date.now()-30*864e5));
  const plus30=N.events.filter(x=>x.ev==='plus_buy'&&x.mode!=='all'&&x.day>=since30).reduce((s,x)=>s+x.n,0);
  const ret=lastWeek&&lastWeek.players?lastWeek.back/lastWeek.players:null;
  let h=`<h2>The numbers that mean the game sticks</h2><div class="tiles">`+
    tile('Players a day',avg(r=>r.players),fmt(avg(r=>r.players)),100,'100 or more','average of days with visits')+
    tile('Started games finished',started?finished/started:null,pct(started?finished/started:null),0.5,'50% or more',fmt(started)+' started')+
    tile('Back the next week',ret,pct(ret),0.25,'25% or more',lastWeek?'signed-in, week of '+lastWeek.week+' ('+lastWeek.players+')':'signed-in players')+
    tile('Daily Yamb entries a day',avg(r=>r.daily),fmt(avg(r=>r.daily)),30,'30 or more','')+
    tile('Visitors in the installed app',visitors?app/visitors:null,pct(visitors?app/visitors:null),0.2,'20% or more','')+
    tile('Games with other people',started?others/started:null,pct(started?others/started:null),0.2,'20% or more','hot seat, multiplayer, duel, real dice')+
    tile('Plus buyers, last 30 days',plus30,fmt(plus30),20,'20 or more','')+
    `</div>`;
  // trend: visitors and players a day
  const asc=rows.slice().reverse();
  if(asc.length>1){
    const W=900,H=200,P=28,mx=Math.max(1,...asc.map(r=>Math.max(r.visitors,r.players)));
    const pt=f=>asc.map((r,i)=>(P+i*(W-2*P)/(asc.length-1)).toFixed(1)+','+(H-P-f(r)*(H-2*P)/mx).toFixed(1)).join(' ');
    h+=`<h2>Trend</h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitors and players a day"><text x="6" y="${P+4}" font-size="12" fill="#6B5A45">${mx}</text><text x="6" y="${H-P+4}" font-size="12" fill="#6B5A45">0</text><text x="${P}" y="${H-8}" font-size="12" fill="#6B5A45">${asc[0].day}</text><text x="${W-P}" y="${H-8}" font-size="12" fill="#6B5A45" text-anchor="end">${asc[asc.length-1].day}</text><polyline fill="none" stroke="#C9A24B" stroke-width="2.5" points="${pt(r=>r.visitors)}"/><polyline fill="none" stroke="#522E16" stroke-width="2.5" points="${pt(r=>r.players)}"/></svg><p class="legend"><i style="background:#C9A24B;margin-left:0"></i>Visitors<i style="background:#522E16"></i>Players</p>`;
  }
  // funnel: of the visitors, how many go on (visitor-days: one person on two days counts twice)
  const ppl=k=>(evs[k]||{}).people||0;
  const fun=[['Visited',visitors],['Started a game',ppl('start:all')],['Finished a game',ppl('finish:all')],['Signed in',ppl('signin:-')],['Looked at Plus',ppl('plus_view:-')],['Bought Plus',ppl('plus_buy:-')]];
  h+=`<h2>From visit to Plus</h2><div class="funnel">${fun.map(([l,n])=>`<div><span>${l}</span><span class="bar" style="width:${visitors?Math.max(0.3,100*n/visitors):0}%"></span><b>${n} · ${pct(visitors?n/visitors:null)}</b></div>`).join('')}</div>`;
  h+=`<h2>Day by day</h2><div class="wrap"><table><tr><th>Day</th><th>Visitors</th><th>Page views</th><th>Players</th><th>Games started</th><th>Finished</th><th>In the app</th><th>Daily Yamb</th></tr>`+
    (rows.length?rows.map(r=>`<tr><td>${r.day}</td><td>${r.visitors}</td><td>${r.views}</td><td>${r.players}</td><td>${r.started}</td><td>${r.finished}</td><td>${r.app}</td><td>${r.daily}</td></tr>`).join(''):`<tr><td colspan="8">No visits counted yet.</td></tr>`)+`</table></div>`;
  const list=(title,arr,key)=>`<div><h2>${title}</h2><table><tr><th></th><th>Visitors</th><th>Views</th></tr>${arr.length?arr.map(x=>`<tr><td>${esc(x[key])}</td><td>${x.people}</td><td>${x.views}</td></tr>`).join(''):'<tr><td colspan="3">None yet.</td></tr>'}</table></div>`;
  const modes=[['cpu','The computer'],['daily','Daily Yamb'],['pp','Hot seat'],['online','Multiplayer'],['duel','Friend duel'],['table','Real dice']];
  const modeT=`<div><h2>Games by mode</h2><table><tr><th></th><th>Started</th><th>Finished</th><th>Players</th></tr>${modes.map(([m,l])=>{const s=evs['start:'+m]||{},f=evs['finish:'+m]||{};return `<tr><td>${l}</td><td>${s.n||0}</td><td>${f.n||0}</td><td>${s.people||0}</td></tr>`;}).join('')}</table></div>`;
  const langs=Object.entries(N.langs||{}).sort((a,b)=>b[1]-a[1]);
  const other=[['install','Installed'],['signin','Signed in'],['plus_view','Looked at Plus'],['plus_buy','Bought Plus'],['tip_buy','Gave a tip']];
  const otherT=`<div><h2>Other things done</h2><table><tr><th></th><th>Times</th></tr>${other.map(([k,l])=>`<tr><td>${l}</td><td>${(evs[k+':-']||{}).n||0}</td></tr>`).join('')}<tr><td>Accounts, all / new</td><td>${N.accounts.all} / ${N.accounts.new}</td></tr></table>
    <h2>Languages</h2><table><tr><th></th><th>Visitors</th></tr>${langs.length?langs.map(([l,n])=>`<tr><td>${esc(l)}</td><td>${n}</td></tr>`).join(''):'<tr><td colspan="2">None yet.</td></tr>'}</table></div>`;
  const weekT=`<div><h2>Signed-in players, week by week</h2><table><tr><th>Week of</th><th>Played</th><th>Back next week</th></tr>${(N.weeks||[]).length?N.weeks.slice().reverse().map(w=>`<tr><td>${w.week}</td><td>${w.players}</td><td>${w.back} (${pct(w.players?w.back/w.players:null)})</td></tr>`).join(''):'<tr><td colspan="3">None yet.</td></tr>'}</table></div>`;
  const st={};(N.stats||[]).forEach(x=>{(st[x.k]=st[x.k]||[]).push(x);});
  const simple=(title,k,head,name)=>{const a=(st[k]||[]).slice().sort((x,y)=>y.n-x.n),tot=a.reduce((q,x)=>q+x.n,0);return `<div><h2>${title}</h2><table><tr><th></th><th>${head}</th><th>Share</th></tr>${a.length?a.map(x=>`<tr><td>${esc(name?name(x.v):x.v)}</td><td>${x.n}</td><td>${pct(tot?x.n/tot:null)}</td></tr>`).join(''):'<tr><td colspan="3">None yet.</td></tr>'}</table></div>`;};
  const modeName=m=>(modes.find(x=>x[0]===m)||[0,m])[1];
  const CH={ema:'Mala Ema',nono:'Nono Bepi',mira:'Teta Mira',joza:'Kum Joza',profesor:'Profesor'};
  let cn=null;try{cn=new Intl.DisplayNames(['en'],{type:'region'});}catch(e){}
  const country=c=>{if(c==='xx')return 'Unknown';try{return cn?cn.of(c.toUpperCase()):c;}catch(e){return c;}};
  const lenT=`<div><h2>How long a game takes</h2><table><tr><th></th><th>Games</th><th>Average</th></tr>${(st.len||[]).length?st.len.map(x=>`<tr><td>${esc(modeName(x.v))}</td><td>${x.n}</td><td>${fmt(x.sum/x.n)} min</td></tr>`).join(''):'<tr><td colspan="3">None yet.</td></tr>'}</table></div>`;
  const used=(k,l)=>{const a=st[k]||[];return `<tr><td>${l}</td><td>${a.reduce((q,x)=>q+x.n,0)}</td><td>${a.reduce((q,x)=>q+Number(x.sum),0)}</td></tr>`;};
  const sh=(st.share||[]);
  const useT=`<div><h2>Used in games</h2><table><tr><th></th><th>Games</th><th>Times</th></tr>${used('hint','Hints')}${used('emo','Reactions')}</table>
    <h2>Links shared</h2><table><tr><th></th><th>Times</th></tr>${[['table','A game on several devices'],['duel','A duel'],['daily','A Daily result'],['rules','House rules']].map(([k,l])=>`<tr><td>${l}</td><td>${(sh.find(x=>x.v===k)||{}).n||0}</td></tr>`).join('')}</table></div>`;
  const hrs=Array.from({length:24},(_,i)=>((st.hour||[]).find(x=>+x.v===i)||{}).n||0),hmx=Math.max(1,...hrs);
  h+=`<h2>Hour of the day (visitors' own time)</h2><div class="hours">${hrs.map((n,i)=>`<i style="height:${100*n/hmx}%" title="${i}:00 · ${n}"></i>`).join('')}</div><div class="hl"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>`;
  h+=`<div class="cols">${list('Where visitors came from',N.sources,'src')}${simple('Countries','country','Visitors',country)}${simple('Devices','device','Visitors')}${list('Pages',N.pages,'page')}${modeT}${simple('Rules chosen','rules','Games')}${simple('Players in a game','players','Games')}${simple('Computer opponents','opp','Games',v=>CH[v]||v)}${lenT}${useT}${otherT}${weekT}</div>`;
  out.innerHTML=h;
}
/* what players wrote from the game's "Send feedback" page, newest first */
async function feedback(){
  let box=document.getElementById('fb');
  if(!box){box=document.createElement('div');box.id='fb';out.prepend(box);}
  box.innerHTML='<h2>Feedback</h2><p class="msg">Loading…</p>';
  try{
    const L=await C.rpc('feedback_list',{p_limit:200});
    const KIND={bug:'Something\'s wrong',idea:'An idea',like:'I like it',other:'Other'};
    const when=s=>{const d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toTimeString().slice(0,5);};
    box.innerHTML=`<h2>Feedback (${L.length})</h2>`+(L.length?`<div class="wrap"><table class="fbt"><tr><th>When</th><th>From</th><th>Kind</th><th>Stars</th><th>Message</th><th>Version · device</th></tr>${L.map(x=>`<tr><td>${when(x.at)}</td><td>${x.signed?esc(x.name||'(no name)')+(x.tester?' · tester':''):'signed out'}</td><td>${KIND[x.kind]||x.kind}</td><td>${x.stars?'★'.repeat(x.stars):''}</td><td style="white-space:pre-wrap;min-width:16em">${esc(x.body)}</td><td>${esc([x.version,x.lang,x.device,x.screen].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table></div>`:'<p class="msg">Nothing yet.</p>');
  }catch(e){box.innerHTML='<h2>Feedback</h2><p class="msg">Could not load: '+esc(String(e&&e.message||e))+'</p>';}
}
async function load(){
  if(!C||!C.available()){msg('The account library did not load. Check the connection and reload.');return;}
  if(!C.user){msg('Sign in to the game first, then open this page again. <a href="../">Go to the game</a>');return;}
  msg('Loading…');
  const to=new Date(),from=new Date(Date.now()-(span-1)*864e5);
  try{render(await C.rpc('numbers',{p_from:day(from),p_to:day(to)}));feedback();}
  catch(e){
    const m=String(e&&e.message||e);
    if(/YC_ADMIN/.test(m))msg('This page is only for the café\'s owner.');
    else if(/Could not find the function|PGRST202/.test(m))msg('The counter is not set up in Supabase yet: run server/schema.sql in the SQL editor.');
    else msg('Could not load the numbers: '+esc(m));
  }
}
function whenReady(){if(C&&C.ready)load();}
if(C){C.on(why=>{if(why==='ready'||why==='in'||why==='out')load();});C.boot();whenReady();}
else msg('The account library did not load.');
})();
</script>
</body>
</html>
